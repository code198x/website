# Code Like It's 198x - Local Development Environment
# Professional retro development toolchain for students

version: '3.8'

services:
  # Development workspace with all tools
  dev-workspace:
    build: ./docker/workspace
    volumes:
      - ./projects:/workspace/projects
      - ./examples:/workspace/examples
      - ~/.gitconfig:/home/developer/.gitconfig:ro
    working_dir: /workspace
    environment:
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
    stdin_open: true
    tty: true
    profiles:
      - dev

  # C64 Compilation Service
  c64-compiler:
    build: ./docker/c64
    volumes:
      - ./projects:/workspace/projects
      - ./examples:/workspace/examples
    working_dir: /workspace

  # ZX Spectrum Compilation Service  
  zx-spectrum-compiler:
    build: ./docker/zx-spectrum
    volumes:
      - ./projects:/workspace/projects
      - ./examples:/workspace/examples
    working_dir: /workspace

  # NES Compilation Service
  nintendo-entertainment-system-compiler:
    build: ./docker/nintendo-entertainment-system
    volumes:
      - ./projects:/workspace/projects
      - ./examples:/workspace/examples
    working_dir: /workspace

  # Amiga Compilation Service
  commodore-amiga-compiler:
    build: ./docker/commodore-amiga
    volumes:
      - ./projects:/workspace/projects
      - ./examples:/workspace/examples
    working_dir: /workspace