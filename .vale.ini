# Vale Configuration for Code198x
# Educational content linting for retro computing platform

StylesPath = .vale/styles

# Minimum alert level
# Levels: suggestion, warning, error
MinAlertLevel = suggestion

# Vocabulary disabled for initial setup
# Vocab = Code198x

# Package URLs for style syncing
[*]
Packages = Microsoft, write-good

# File associations
[*.{md,rst}]
BasedOnStyles = Vale, Code198x
# Focus on educational content consistency

# Vale's built-in rules
Vale.Spelling = YES
Vale.Terms = YES
Vale.Avoid = YES
Vale.Repetition = YES

# Specific rules for documentation
[*.md]
BasedOnStyles = Vale, Code198x

# Specific rules for lessons (MDX files)  
[*.mdx]
BasedOnStyles = Vale, Code198x
# Educational lessons may need more flexibility

# README and top-level docs
[README.md]
BasedOnStyles = Vale, Code198x

# Ignore build artifacts and dependencies
[/output/**, /node_modules/**, /dist/**]
BasedOnStyles = 