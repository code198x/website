# Vale — prose style linter for curriculum + vault content.
#
# Uses the shared house style (House198x), pulled from a versioned package so
# every repo lints against the same rules — one canonical copy, no drift.
# Source: https://github.com/stevehill1981/house-style
#
# Setup (once, and after a style release):  mkdir -p .vale && vale sync
# Vale owns words, phrasing, and voice; the readability report
# (npm run prose:read) owns sentence length and grade level.
# Run both with: npm run prose:check
#
# Everything here is a *suggestion* — a signal to weigh, not a gate. Hard
# domain difficulty is legitimate; this catches the avoidable kind (bloated
# words, hedges, condescension, American spellings).

StylesPath = .vale
Packages = https://github.com/stevehill1981/house-style/releases/latest/download/House198x.zip
MinAlertLevel = suggestion

# MDX is markdown-plus-JSX; lint it as markdown.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = House198x

# Passive voice is OFF by default. Regex passive-detection is the noisiest
# linter rule there is, and in a hardware curriculum passive is often the right
# choice ("the interrupt is raised", "the byte is latched"). The rule encodes
# the "active voice" principle and stays one toggle away — flip to `suggestion`
# for an occasional skim, but don't let it pollute the default signal.
House198x.Passive = NO

# Skip MDX import/export statements (not prose).
BlockIgnores = (?m)^(import|export) .+$

# Skip JSX component tags like <CodeFromFile ... /> (capitalised tag names).
TokenIgnores = (</?[A-Z][A-Za-z0-9]*[^>]*/?>)
