# Nintendo Entertainment System - The console that saved gaming
name: Nintendo Entertainment System
shortName: NES
year: 1983
color: "#e30613"
tagline: "The console that revived an industry"

# Curated machine colours (family-visual-identity.md §3); the primary is the spot ink
colours:
  - name: "Nintendo red (current brand)"
    hex: "#e60012"
    role: logo
    primary: true
    confidence: estimate
    source: "https://www.nintendo.com/us/ and https://www.nintendo.com/en-gb/ theme colour, checked 2026-10-01; exact today, an estimate for the 1985 print red (no 1980s spec found)"
  - name: "Upper shell"
    hex: "#cccbc9"
    role: case
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:NES-Console-Set.jpg, sampled; reference/by-system/nintendo-nes/nes-3d-modelling-reference-audit.md:9-14"
  - name: "Lower shell"
    hex: "#727071"
    role: case
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:NES-Console-Set.jpg, sampled; reference/by-system/nintendo-nes/nes-3d-modelling-reference-audit.md:9-14"
  - name: "Black band"
    hex: "#2b2b2b"
    role: case
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:NES-Console-Set.jpg, sampled; reference/by-system/nintendo-nes/nes-3d-modelling-reference-audit.md:9-14"
  - name: "Controller face"
    hex: "#3e3e3e"
    role: case
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:NES-Console-Set.jpg, sampled; reference/by-system/nintendo-nes/nes-3d-modelling-reference-audit.md:9-14"
  - name: "A and B buttons"
    hex: "#cf0000"
    role: keys
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:NES-Console-Set.jpg, sampled; reference/by-system/nintendo-nes/nes-3d-modelling-reference-audit.md:9-14; probably gamut-clipped"
  - name: "Super Mario Bros. sky ($22)"
    hex: "#8287ff"
    role: screen
    confidence: measured
    source: "https://www.nesdev.org/wiki/Special:Redirect/file/2C02G_wiki.pal (2C02G palette); index $22 from https://gist.github.com/1wErt3r/4048722 lines 1426-1427"
  - name: "Black ($0F)"
    hex: "#000000"
    role: screen
    confidence: exact
    source: "reference/by-system/nintendo-nes/ppu-programming.md:425; https://www.nesdev.org/wiki/Special:Redirect/file/2C02G_wiki.pal (2C02G palette)"
  - name: "Grey ($00)"
    hex: "#626262"
    role: screen
    confidence: measured
    source: "https://www.nesdev.org/wiki/Special:Redirect/file/2C02G_wiki.pal (2C02G palette)"
  - name: "Red ($16)"
    hex: "#a92704"
    role: screen
    confidence: measured
    source: "https://www.nesdev.org/wiki/Special:Redirect/file/2C02G_wiki.pal (2C02G palette)"

# Classification
type: console
bits: "8"
region: Japan
manufacturer: nintendo
cpu: Ricoh 2A03
cpuArchitecture: "6502"

# Toolchain
assembler: ca65 / ld65
dialect: ca65
assemblerLanguage: ca65
emulator: FCEUX
buildOutput: .nes ROM files
toolchainExtras:
  - cc65 C compiler
  - Screenshot capture

# Family support surfaces (only set when the bar is met — see content.config.ts)
devReady: true

# Family support surfaces (only set when the bar is met — see content.config.ts)
emu198x: true

# Navigation & readiness (tier is the single source of truth)
tier: live
navOrder: 3
