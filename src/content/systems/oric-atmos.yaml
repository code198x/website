# What the machine can do (docs: specifications/system-profile.md)
capability:
  configuration: "Oric Atmos with 48K and BASIC 1.1, UK model"
  processor:
    value: "A 6502 at 1 MHz. The ULA divides it from a 12 MHz crystal and shares the memory with it, using more than half of each cycle to fetch the picture."
    sources:
      - "Mike Brown, The Oric 1/Atmos Unofficial ULA Guide (1996), bus clock signal production"
      - "The Oric 1 Companion (LINSAC), appendix 3, 6502 mnemonic codes, p. 166"
  memory:
    value: "64K of dynamic RAM. ROM sits over the top 16K (#C000 to #FFFF), leaving 48K of RAM below it, including the input and output addresses at #0300."
    sources:
      - "Service Manual for the Oric-1 and Oric Atmos Microcomputers (Oric Products International, 1984), pp. 10–11"
      - "The Oric Atmos Handbook (Century), appendix 7, system memory map, p. 234"
  display:
    value: "TEXT mode, 40 columns by 28 lines from #BB80, and HIRES mode, 240 by 200 pixels from #A000 with three text lines beneath. Eight colours. Colour is set by serial attributes: a byte in the screen changes the ink or paper colour for the rest of its line, and its own cell shows the paper colour. A second character set lives at #B800."
    sources:
      - "Mike Brown, The Oric 1/Atmos Unofficial ULA Guide (1996), text and hires modes, attributes"
      - "The Oric Atmos Handbook (Century), pp. 13 (colours), 131 (high resolution screen) and 234 (memory map)"
  sound:
    value: "An AY-3-8912 sound chip with three tone channels spanning eight octaves, a noise channel and volume envelopes. BASIC drives it with SOUND, MUSIC and PLAY."
    sources:
      - "Service Manual for the Oric-1 and Oric Atmos Microcomputers (Oric Products International, 1984), parts list, p. 53"
      - "The Oric Atmos Handbook (Century), pp. 87–88"
  input:
    value: "The keyboard, scanned through the sound chip's I/O port and the 6522 VIA. No joystick port is fitted."
    sources:
      - "Service Manual for the Oric-1 and Oric Atmos Microcomputers (Oric Products International, 1984), pp. 16–20 and circuit drawing"
      - "The Oric Atmos Handbook (Century), p. 3 (rear connections)"
  storage:
    value: "Cassette tape, through the 6522 VIA. Programs save at a fast speed or a slow one for poor recordings; slow takes about eight times as long."
    sources:
      - "The Oric Atmos Handbook (Century), p. 151"
      - "Service Manual for the Oric-1 and Oric Atmos Microcomputers (Oric Products International, 1984), pp. 18–20"
  expansion:
    value: "A bus expansion connector, a parallel printer port driven by the 6522 VIA, and RGB and television video outputs."
    sources:
      - "The Oric Atmos Handbook (Century), p. 3 (rear connections)"
      - "Service Manual for the Oric-1 and Oric Atmos Microcomputers (Oric Products International, 1984), pp. 16–20"
  firmware:
    value: "16K of ROM holding the BASIC interpreter and operating system, version 1.1 on the Atmos, which corrected bugs in the Oric-1's and added commands. The machine starts in BASIC."
    sources:
      - "The Oric Atmos Handbook (Century), appendix 7, p. 234, and chapter 17, p. 188"
      - "Service Manual for the Oric-1 and Oric Atmos Microcomputers (Oric Products International, 1984), pp. 10–11"
