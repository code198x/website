# The same ASIC hardware as the CPC Plus in a cartridge console: Z80A, 4096-
# colour palette, 16 hardware sprites, programmable raster interrupt and DMA
# sound. MAME emulates it from the CPC Plus machine configuration and shares its
# ROM definition outright (`#define rom_gx4000 rom_cpc6128p`), which is the
# clearest statement of how little separates them.
