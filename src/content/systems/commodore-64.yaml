# Commodore 64 - The best-selling home computer of all time
name: Commodore 64
shortName: C64
year: 1982
color: "#4a4dff"
tagline: "The best-selling computer of all time"

# Curated machine colours (family-visual-identity.md §3); the primary is the spot ink
colours:
  - name: "Light blue, border and text (14)"
    hex: "#706deb"
    role: screen
    primary: true
    confidence: measured
    source: "https://www.pepto.de/projects/colorvic/ (Colodore model, default settings); Commodore 64 User's Guide (Commodore Business Machines, 1982), p. 9"
  - name: "Breadbin case (RAL 1019, unverified)"
    hex: "#a48f7a"
    role: case
    confidence: estimate
    source: "https://dfarq.homeip.net/commodore-64-models/ names RAL 1019; sRGB from https://en.wikipedia.org/wiki/List_of_RAL_colours"
  - name: "Keys, dark brown"
    hex: "#2a2218"
    role: keys
    confidence: estimate
    source: "https://deskthority.net/wiki/Commodore_64 (\"very dark brown\"); Evan-Amos, https://commons.wikimedia.org/wiki/File:Commodore-64-Computer-FR.jpg (public domain, 2017), sampled"
  - name: "Function keys"
    hex: "#7f7764"
    role: keys
    confidence: estimate
    source: "Evan-Amos, https://commons.wikimedia.org/wiki/File:Commodore-64-Computer-FR.jpg (public domain, 2017), sampled; https://deskthority.net/wiki/Commodore_64"
  - name: "Background blue (6)"
    hex: "#2e2c9b"
    role: screen
    confidence: measured
    source: "https://www.pepto.de/projects/colorvic/ (Colodore model, default settings); Commodore 64 User's Guide (Commodore Business Machines, 1982), p. 9"
  - name: "White (1)"
    hex: "#ffffff"
    role: screen
    confidence: measured
    source: "https://www.pepto.de/projects/colorvic/ (Colodore model, default settings)"
  - name: "Red (2)"
    hex: "#813338"
    role: screen
    confidence: measured
    source: "https://www.pepto.de/projects/colorvic/ (Colodore model, default settings)"
  - name: "Cyan (3)"
    hex: "#75cec8"
    role: screen
    confidence: measured
    source: "https://www.pepto.de/projects/colorvic/ (Colodore model, default settings)"
  - name: "Yellow (7)"
    hex: "#edf171"
    role: screen
    confidence: measured
    source: "https://www.pepto.de/projects/colorvic/ (Colodore model, default settings)"

# Classification
type: computer
bits: "8"
region: US
manufacturer: commodore
cpu: MOS 6510
cpuArchitecture: "6502"

# Toolchain
assembler: ACME
dialect: acme
assemblerLanguage: "6502"
emulator: VICE (x64sc)
buildOutput: .prg files
toolchainExtras:
  - petcat for BASIC
  - Screenshot capture

# Family support surfaces (only set when the bar is met — see content.config.ts)
emu198x: true
devReady: true

# Navigation & readiness (tier is the single source of truth)
tier: live
navOrder: 1
