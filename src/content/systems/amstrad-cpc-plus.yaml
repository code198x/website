# Z80A as before, but the Gate Array is replaced by an ASIC: 4096-colour
# palette (12-bit) against the classic's 27, 16 hardware sprites of 16x16 with
# zooming, a programmable raster interrupt on any scanline instead of the fixed
# HSYNC counter, three DMA sound channels driving the AY, hardware split-screen
# and horizontal soft scroll, and an AMS40489 CRTC (type 3) with an integrated
# PPI. The Plus features stay hidden behind an unlock sequence, which is how the
# machine stays compatible with the classic CPC.
cpu: Zilog Z80A
cpuArchitecture: "z80"

