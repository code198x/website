# Two CPUs, one active at a time, switched in software via the S1990 bus
# controller: the R800 at 7.16 MHz and a Z80A at 3.58 MHz for exact-timing
# compatibility. The R800 is Z80-instruction-compatible with a 16-bit ALU and
# two added multiply instructions (MULUB, MULUW), so the programming identity
# a learner meets first is still Z80 — hence `z80` here rather than a new
# architecture value. Confirmed against openMSX (`src/cpu/MSXCPU.hh`,
# `enum class Type { Z80, R800 }`) and MAME (`src/mame/msx/msxtr.cpp`).
cpu: ASCII R800 + Zilog Z80A
cpuArchitecture: "z80"

