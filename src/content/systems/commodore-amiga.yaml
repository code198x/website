# Commodore Amiga - The multimedia powerhouse
name: Commodore Amiga
shortName: Amiga
year: 1985
color: "#ff6600"
tagline: "The multimedia powerhouse"

# Curated machine colours (family-visual-identity.md §3); the primary is the spot ink
colours:
  - name: "Workbench 1.x blue"
    hex: "#0055aa"
    role: screen
    primary: true
    confidence: exact
    source: "Kickstart 1.3 ROM default Preferences at $FDB9D2; Commodore-Amiga, Amiga Intuition Reference Manual (Addison-Wesley, 1986), p. 28; register $05A doubled per digit, Commodore-Amiga, Amiga Hardware Reference Manual (1985), Table 3-2, p. 40"
  - name: "A500 case"
    hex: "#d6c7b4"
    role: case
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:Amiga_500,_front,_Google_NY_office_computer_museum.jpg (CC BY 2.0), sampled"
  - name: "A500 letter keys"
    hex: "#d2c4ab"
    role: keys
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:Amiga_500,_front,_Google_NY_office_computer_museum.jpg (CC BY 2.0), sampled"
  - name: "A500 Commodore badge plate"
    hex: "#aa9886"
    role: badge
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:Amiga_500,_front,_Google_NY_office_computer_museum.jpg (CC BY 2.0), sampled"
  - name: "Workbench 1.x white"
    hex: "#ffffff"
    role: screen
    confidence: exact
    source: "Kickstart 1.3 ROM default Preferences at $FDB9D2; Commodore-Amiga, Amiga Intuition Reference Manual (Addison-Wesley, 1986), p. 28"
  - name: "Workbench 1.x black"
    hex: "#000022"
    role: screen
    confidence: exact
    source: "Kickstart 1.3 ROM default Preferences at $FDB9D2; Commodore-Amiga, Amiga Intuition Reference Manual (Addison-Wesley, 1986), p. 28"
  - name: "Workbench 1.x orange"
    hex: "#ff8800"
    role: screen
    confidence: exact
    source: "Kickstart 1.3 ROM default Preferences at $FDB9D2; Commodore-Amiga, Amiga Intuition Reference Manual (Addison-Wesley, 1986), p. 28; Commodore-Amiga, Amiga Hardware Reference Manual (1985), Table 3-16, p. 88, names $F80 \"Red-orange\""
  - name: "Workbench 2.x and 3.x grey"
    hex: "#aaaaaa"
    role: screen
    confidence: exact
    source: "Kickstart 3.1 (40.63) ROM default Preferences at $685AE (and Kickstart 3.0, 39.106, at $684B4); decoded from devs/system-configuration on Workbench 2.04, 2.05 and 3.1 disks; no published primary source cited yet"
  - name: "Workbench 2.x and 3.x blue"
    hex: "#6688bb"
    role: screen
    confidence: exact
    source: "Kickstart 3.1 (40.63) ROM default Preferences at $685AE (and Kickstart 3.0, 39.106, at $684B4); decoded from devs/system-configuration on Workbench 2.04, 2.05 and 3.1 disks; no published primary source cited yet"
  - name: "Insert-disk hand blue"
    hex: "#7777cc"
    role: screen
    confidence: exact
    source: "Kickstart 1.3 ROM table at $FE872A"

# Classification
type: computer
bits: "16"
region: US
manufacturer: commodore
cpu: Motorola 68000
cpuArchitecture: "68000"

# Toolchain
assembler: vasm (68000)
dialect: vasm
assemblerLanguage: m68k
emulator: FS-UAE
buildOutput: Executables / .adf disks
toolchainExtras:
  - amitools (xdftool)
  - Video capture
  - NDK 3.2

# Family support surfaces (only set when the bar is met — see content.config.ts)
emu198x: true
devReady: true

# Navigation & readiness (tier is the single source of truth)
tier: live
navOrder: 4
