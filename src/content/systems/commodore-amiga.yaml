  - name: "A500 case"
    hex: "#d6c7b4"
    role: case
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:Amiga_500,_front,_Google_NY_office_computer_museum.jpg (CC BY 2.0), sampled"
  - name: "A500 letter keys"
    hex: "#d2c4ab"
    role: keys
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:Amiga_500,_front,_Google_NY_office_computer_museum.jpg (CC BY 2.0), sampled"
  - name: "A500 Commodore badge plate"
    hex: "#aa9886"
    role: badge
    confidence: estimate
    source: "https://commons.wikimedia.org/wiki/File:Amiga_500,_front,_Google_NY_office_computer_museum.jpg (CC BY 2.0), sampled"
  - name: "Workbench 1.x white"
    hex: "#ffffff"
    role: screen
    confidence: exact
    source: "Kickstart 1.3 ROM default Preferences at $FDB9D2; reference/by-system/commodore-amiga/1986-amiga-intuition-reference-manaual.txt:1617-1619"
  - name: "Workbench 1.x black"
    hex: "#000022"
    role: screen
    confidence: exact
    source: "Kickstart 1.3 ROM default Preferences at $FDB9D2; reference/by-system/commodore-amiga/1986-amiga-intuition-reference-manaual.txt:1617-1619"
  - name: "Workbench 1.x orange"
    hex: "#ff8800"
    role: screen
    confidence: exact
    source: "Kickstart 1.3 ROM default Preferences at $FDB9D2; reference/by-system/commodore-amiga/1986-amiga-intuition-reference-manaual.txt:1617-1619; reference/by-system/commodore-amiga/1985-amiga-hardware-reference-manual.txt:4104-4119 names $F80 \"Red-orange\""
