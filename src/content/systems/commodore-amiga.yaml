# Classification
type: computer
bits: "16"
region: US
manufacturer: commodore
cpu: Motorola 68000
cpuArchitecture: "68000"

# Toolchain
assembler: vasm (68000)
dialect: vasm
assemblerLanguage: m68k
emulator: FS-UAE
buildOutput: Executables / .adf disks
toolchainExtras:
  - amitools (xdftool)
  - Video capture
  - NDK 3.2

# Family support surfaces (only set when the bar is met — see content.config.ts)
emu198x: true
devReady: true

# Navigation & readiness (tier is the single source of truth)
tier: live
navOrder: 4
