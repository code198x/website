# Sinclair ZX Spectrum - Britain's iconic home computer
name: Sinclair ZX Spectrum
shortName: Spectrum
year: 1982
color: "#cc0000"
tagline: "Britain's gateway to gaming"

# Curated machine colours (family-visual-identity.md §3); the primary is the spot ink
colours:
  - name: "Screen red (normal)"
    hex: "#c20000"
    role: screen
    primary: true
    confidence: measured
    source: "Index exact (ULA colour 2, normal); level derived from Chris Smith, The ZX Spectrum ULA (ZX Design and Media, 2010), Table 16-1, pp. 158-159"
  - name: "Stripe red"
    hex: "#ff5238"
    role: livery
    confidence: estimate
    source: "uncalibrated photograph of a ZX Spectrum (photographer and licence unrecorded), sampled; colours named in Alessandro Grussu, Spectrumpedia, vol. 2, English edition, p. 10"
  - name: "Stripe yellow"
    hex: "#eddc0d"
    role: livery
    confidence: estimate
    source: "uncalibrated photograph of a ZX Spectrum (photographer and licence unrecorded), sampled; colours named in Alessandro Grussu, Spectrumpedia, vol. 2, English edition, p. 10"
  - name: "Stripe green"
    hex: "#6bd723"
    role: livery
    confidence: estimate
    source: "uncalibrated photograph of a ZX Spectrum (photographer and licence unrecorded), sampled; colours named in Alessandro Grussu, Spectrumpedia, vol. 2, English edition, p. 10"
  - name: "Stripe cyan"
    hex: "#1bf1fe"
    role: livery
    confidence: estimate
    source: "uncalibrated photograph of a ZX Spectrum (photographer and licence unrecorded), sampled; colours named in Alessandro Grussu, Spectrumpedia, vol. 2, English edition, p. 10; channels clipped"
  - name: "Case black"
    hex: "#18191a"
    role: case
    confidence: estimate
    source: "uncalibrated photograph of a ZX Spectrum (photographer and licence unrecorded), sampled; colours named in Alessandro Grussu, Spectrumpedia, vol. 2, English edition, p. 10; https://collections.vam.ac.uk/item/O1300970/zx-spectrum-personal-computer-dickinson-rick/"
  - name: "Keys blue-grey"
    hex: "#5d7c74"
    role: keys
    confidence: estimate
    source: "uncalibrated photograph of a ZX Spectrum (photographer and licence unrecorded), sampled; colours named in Alessandro Grussu, Spectrumpedia, vol. 2, English edition, p. 10; https://collections.vam.ac.uk/item/O1300970/zx-spectrum-personal-computer-dickinson-rick/"
  - name: "Paper white (power-on)"
    hex: "#c2c2c2"
    role: screen
    confidence: measured
    source: "Index exact (ROM colour initialisation: Ian Logan and Frank O'Hara, The Complete Spectrum ROM Disassembly (Melbourne House, 1983), p. 60); level derived from Chris Smith, The ZX Spectrum ULA (ZX Design and Media, 2010), Table 16-1, pp. 158-159"
  - name: "Ink black"
    hex: "#000000"
    role: screen
    confidence: exact
    source: "Ian Logan and Frank O'Hara, The Complete Spectrum ROM Disassembly (Melbourne House, 1983), p. 60"
  - name: "Bright red"
    hex: "#ff0000"
    role: screen
    confidence: measured
    source: "Index exact (128K ROM 0 stripe string at 0x3812); level derived from Chris Smith, The ZX Spectrum ULA (ZX Design and Media, 2010), Table 16-1, pp. 158-159, RGB a convention"
  - name: "Bright yellow"
    hex: "#ffff00"
    role: screen
    confidence: measured
    source: "Index exact (128K ROM 0 stripe string at 0x3812); level derived from Chris Smith, The ZX Spectrum ULA (ZX Design and Media, 2010), Table 16-1, pp. 158-159, RGB a convention"
  - name: "Bright green"
    hex: "#00ff00"
    role: screen
    confidence: measured
    source: "Index exact (128K ROM 0 stripe string at 0x3812); level derived from Chris Smith, The ZX Spectrum ULA (ZX Design and Media, 2010), Table 16-1, pp. 158-159, RGB a convention"
  - name: "Bright cyan"
    hex: "#00ffff"
    role: screen
    confidence: measured
    source: "Index exact (128K ROM 0 stripe string at 0x3812); level derived from Chris Smith, The ZX Spectrum ULA (ZX Design and Media, 2010), Table 16-1, pp. 158-159, RGB a convention"

# Classification
type: computer
bits: "8"
region: UK
manufacturer: sinclair
cpu: Zilog Z80
cpuArchitecture: z80

# Toolchain
assembler: Asm198x (Pasmo notation)
dialect: pasmo
assemblerLanguage: z80
emulator: Emu198x (runs in the page)
buildOutput: .tap files
toolchainExtras:
  - zmakebas for BASIC
  - Screenshot capture

# Family support surfaces (only set when the bar is met — see content.config.ts)
emu198x: true
devReady: true

# Navigation & readiness (tier is the single source of truth)
tier: live
navOrder: 2
