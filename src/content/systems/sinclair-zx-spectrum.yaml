# Sinclair ZX Spectrum - Britain's iconic home computer
name: Sinclair ZX Spectrum
shortName: Spectrum
year: 1982
color: "#cc0000"
tagline: "Britain's gateway to gaming"

# Classification
type: computer
bits: "8"
region: UK
manufacturer: sinclair
cpu: Zilog Z80
cpuArchitecture: z80

# Toolchain
assembler: pasmonext
dialect: pasmonext
assemblerLanguage: z80
emulator: Fuse
buildOutput: .tap / .sna files
toolchainExtras:
  - zmakebas for BASIC
  - Screenshot capture

# Family support surfaces (only set when the bar is met — see content.config.ts)
emu198x: true
devReady: true

# Navigation & readiness (tier is the single source of truth)
tier: live
navOrder: 2
