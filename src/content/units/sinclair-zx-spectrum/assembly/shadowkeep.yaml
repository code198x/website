platform: sinclair-zx-spectrum
track: assembly
moduleSlug: shadowkeep
# Shadowkeep pass 1 — "the Place". A multi-room, lit, atmospheric keep you explore
# and clear — and, from Unit 11, a keep you can lose. The jeopardy is woven into
# the arc (the game core, 9-12), not appended: the Place becomes a game at its
# middle, and atmosphere and voice deepen a thing that already plays. Counts are
# illustrative, not fixed.
phases:
  - name: "Into the keep"
    description: "Gloaming's engine becomes Shadowkeep — the hooded thief, the first hall, a place to move"
    hours: "3-5"
    start: 1
    end: 4
  - name: "A keep of rooms"
    description: "The flick-screen world — many rooms, doorways, a keep you can explore"
    hours: "3-5"
    start: 5
    end: 8
  - name: "The keep is a game"
    description: "Want, threat and fail — gold to steal, a Warden that patrols it, a way to lose, a guard for every room"
    hours: "4-6"
    start: 9
    end: 12
  - name: "Mood and light"
    description: "Atmosphere over the finished game — attribute lighting, furnishings, a sense of place"
    hours: "3-5"
    start: 13
    end: 16
  - name: "The keep's voice"
    description: "Audio and the sealed chapter — footsteps, doors, a theme, and both endings proven"
    hours: "2-4"
    start: 17
    end: 19
