title: "The shipped games learned to be lost"
pubDate: 2026-07-05
summary: "A pass over every finished game to make sure each has real stakes — a win you earn and a loss you can genuinely hit. Flock now shows both its endings, and a couple of latent bugs that quietly made games un-losable are closed."
