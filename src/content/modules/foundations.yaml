# The cross-platform section. Every module here is language-neutral and gates
# nothing; a learner who wants a machine first can go straight to one. The
# programming modules run Basics -> Working It Out -> Decisions -> Repeating ->
# Structure. Counting in Twos and Working the Bits are the number sense a machine
# assumes. Truth Tables and Gates and the Adder are side-paths. From Source to
# Silicon is the assembly arm. See Code198x
# docs/decisions/foundations-is-language-neutral.md
section: foundations
modules:
  - number: 1
    slug: basics
    name: The Basics
    kind: teaching
    status: complete
    tagline: What a program is, before any machine
    skills:
      - A program is instructions in order
      - Output
      - Variables
      - Input
    requires: []
  - number: 2
    slug: working-it-out
    name: Working It Out
    kind: teaching
    status: complete
    tagline: Arithmetic, the counter, and the leftover
    skills:
      - Arithmetic and precedence
      - A box that grows from itself
      - Remainder and rounding
    requires:
      - basics
  - number: 3
    slug: decisions
    name: Decisions
    kind: teaching
    status: complete
    tagline: A program that reacts
    skills:
      - IF and ELSE
      - Flags
      - AND, OR and NOT
    requires:
      - working-it-out
  - number: 4
    slug: truth-tables
    name: Truth Tables
    kind: teaching
    status: complete
    tagline: Every case a question can have, written down
    skills:
      - Propositions and NOT
      - AND, OR and XOR
      - De Morgan's laws
      - Proving two guards the same
    requires:
      - decisions
  - number: 5
    slug: repeating
    name: Repeating
    kind: teaching
    status: complete
    tagline: Three kinds of loop, and the game loop
    skills:
      - Counted loops
      - Loop-until and the game loop
      - The loop that checks first
    requires:
      - decisions
  - number: 6
    slug: structure
    name: Structure
    kind: teaching
    status: complete
    tagline: Lists, named jobs, and finding out why it's wrong
    skills:
      - Lists
      - Subroutines and parameters
      - Debugging
    requires:
      - repeating
  - number: 7
    slug: counting-in-twos
    name: Counting in Twos
    kind: teaching
    status: complete
    tagline: Binary, hex, two bytes, and a minus made of switches
    skills:
      - Decimal, binary and hex
      - Bits, nibbles, bytes and words
      - Two's complement
    requires:
      - working-it-out
  - number: 8
    slug: working-the-bits
    name: Working the Bits
    kind: teaching
    status: complete
    tagline: Masks, shifts, letters and fractions
    skills:
      - Masking and shifting
      - Character codes
      - Floating-point and fixed-point
    requires:
      - counting-in-twos
      - decisions
  - number: 9
    slug: gates-and-the-adder
    name: Gates and the Adder
    kind: teaching
    status: complete
    tagline: The same tables, built out of wire, until they add
    skills:
      - A gate is a truth table
      - The half adder
      - The full adder
      - Ripple carry
    requires:
      - truth-tables
      - counting-in-twos
  - number: 10
    slug: from-source-to-silicon
    name: From Source to Silicon
    kind: teaching
    status: coming-soon
    tagline: Why interpreted is slow and assembled is fast
    skills:
      - What "run" means
      - Interpreting as you go
      - Translating once, ahead of time
      - What speed costs you
    requires:
      - working-the-bits
