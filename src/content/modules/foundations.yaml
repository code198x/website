# The cross-platform section. General Programming and Numbers & Bits are
# language-neutral and gate nothing; From Source to Silicon is the assembly arm.
# All are taught once rather than per system. See Code198x
# docs/decisions/foundations-is-language-neutral.md
section: foundations
modules:
  - number: 1
    slug: general-programming
    name: General Programming
    kind: teaching
    status: complete
    tagline: What a program is — before any machine
    skills:
      - What a program is
      - Sequence and variables
      - Conditionals and loops
      - Subroutines
    requires: []
  - number: 2
    slug: truth-tables
    name: Truth Tables
    kind: teaching
    status: complete
    tagline: Every case a question can have, written down
    skills:
      - Propositions and NOT
      - AND, OR and XOR
      - De Morgan's laws
      - Proving two guards the same
    requires:
      - general-programming
  - number: 3
    slug: numbers-and-bits
    name: Numbers & Bits
    kind: teaching
    status: complete
    tagline: Binary, hex, and the bit logic every machine leans on
    skills:
      - Decimal, binary and hex
      - Bits, nibbles and bytes
      - Two's complement
      - Masking and shifting
    requires:
      - general-programming
  - number: 4
    slug: gates-and-the-adder
    name: Gates and the Adder
    kind: teaching
    status: complete
    tagline: The same tables, built out of wire, until they add
    skills:
      - A gate is a truth table
      - The half adder
      - The full adder
      - Ripple carry
    requires:
      - truth-tables
      - numbers-and-bits
  - number: 5
    slug: from-source-to-silicon
    name: From Source to Silicon
    kind: teaching
    status: coming-soon
    tagline: Why interpreted is slow and assembled is fast
    skills:
      - What "run" means
      - Interpreting as you go
      - Translating once, ahead of time
      - What speed costs you
    requires:
      - numbers-and-bits
