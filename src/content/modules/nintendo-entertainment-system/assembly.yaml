    tagline: The assembly on-ramp — meet the 6502 and the NES one idea at a time, before you build a thing.
    skills:
      - Registers and memory
      - The PPU window and palettes
      - Test-and-branch control flow
      - The NMI frame heartbeat
    status: complete
