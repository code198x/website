platform: sinclair-zx-spectrum
track: basic
modules:
  # Primer — the on-ramp, before Volume 1
  - number: 0
    slug: meet-basic
    name: Meet BASIC
    kind: teaching
    tagline: Make a story, then build a guessing game with useful clues. Six lessons to begin.
    thumbnail: /images/sinclair-zx-spectrum/basic/meet-basic/opening/unit-04-story.png
    phase: Primer
    skills:
      - Keyword entry and editing
      - PRINT, LET and INPUT
      - Strings and readable output
      - Saving and recovering a program
    status: in-progress
  # Volume 1 — First Programs
  - number: 1
    slug: story-builder
    name: Story Builder
    tagline: Your first program — ask questions, build a story
    phase: First Programs
    skills:
      - PRINT
      - CLS
      - INPUT
      - String variables
    status: complete
  - number: 2
    slug: lucky-number
    name: Lucky Number
    tagline: Guess the number — the screen responds with colour and sound
    thumbnail: /images/sinclair-zx-spectrum/basic/lucky-number/unit-05/rating.png
    phase: First Programs
    skills:
      - ABS / distance
      - Colour feedback (BORDER)
      - Directional sound (BEEP)
      - An offered start (PAUSE)
      - A rating from a guess count
    status: complete
  - number: 3
    slug: oracle-stone
    name: Oracle Stone
    tagline: Ask a question — the Oracle pretends to think
    thumbnail: /images/sinclair-zx-spectrum/basic/oracle-stone/unit-06/chamber.png
    phase: First Programs
    skills:
      - Selection (chained IF/THEN on RND)
      - Suspense (PAUSE / BEEP)
      - Colour as a voice (INK)
      - GO SUB subroutines
      - Block graphics (CHR$ 143)
    requires:
      - module: lucky-number
        thread: Chance and its consequences
        why: you made the machine pick a number; here it picks an answer
    status: complete
  - number: 4
    slug: reflex
    name: Reflex
    tagline: Wait for the flash — press any key — see your time
    phase: First Programs
    skills:
      - INKEY$
      - PLOT / DRAW
      - Loop-counter timing
    status: complete
  - number: 5
    slug: dice-roller
    name: Dice Roller
    tagline: Roll dice and watch patterns emerge from randomness
    phase: First Programs
    skills:
      - Accumulation (tally counters)
      - A live dashboard (PRINT AT in place)
      - Player input sets the run (INPUT)
      - Data visualisation (CHR$ 143 bar charts)
    requires:
      - module: lucky-number
        thread: Chance and its consequences
        why: you used RND for one number; here it runs a hundred times and you count
    status: complete
  - number: 6
    slug: bright-spark
    name: Bright Spark
    tagline: Watch the panels flash, repeat the sequence
    phase: First Programs
    skills:
      - Strings as growing sequences
      - STR$ / VAL / LEN / indexing
      - The flash (BRIGHT + BEEP)
      - The game loop (show, repeat, check, grow)
    requires:
      - module: story-builder
        thread: Where the data lives
        why: you stored words in a variable; here the string grows every turn
    status: complete
  - number: 7
    slug: hi-lo
    name: Hi-Lo
    tagline: Higher or lower — protect your streak
    phase: First Programs
    skills:
      - AND + the ok-flag verdict
      - Loop-until-condition (the streak)
      - User-defined graphics (the cards)
      - Best-score tracking
    requires:
      - module: lucky-number
        thread: Chance and its consequences
        why: you judged one guess; here a run of them becomes a streak
    status: complete
  - number: 8
    slug: touchdown
    name: Touchdown
    tagline: Land the spacecraft — gravity pulls, fuel burns
    phase: First Programs
    skills:
      - The continuous (real-time) game loop
      - Gravity / thrust physics
      - Sprite animation (erase-and-redraw)
      - Ambient feedback (BORDER / BEEP)
    requires:
      - module: reflex
        thread: Moving in real time
        why: you read the keyboard while the program ran; here it never stops running
    status: complete
  # Volume 2 — Patterns of State
  - number: 9
    slug: cipher
    name: Cipher
    tagline: Guess the word one letter at a time
    phase: Patterns of State
    skills:
      - Slice-assignment into a string
      - DATA as a content list (RESTORE + counted READ)
      - A tried-set (string membership)
      - Data-driven design
    requires:
      - module: bright-spark
        thread: Where the data lives
        why: you pulled letters out of a string; here you write them back in
    status: complete
  - number: 10
    slug: quiz-master
    name: Quiz Master
    tagline: Four rounds, climbing score, ratings to chase
    phase: Patterns of State
    skills:
      - DIM arrays (indexed storage)
      - An answer-key array
      - RESTORE to a line (DATA sections)
      - A per-category score array
    requires:
      - module: cipher
        thread: Where the data lives
        why: you loaded content from DATA; here it fills an array you index
    status: complete
  - number: 11
    slug: locksmith
    name: Locksmith
    tagline: Crack the code — logic and deduction
    phase: Patterns of State
    skills:
      - Parsing input into an array
      - Comparing two arrays (bulls)
      - The digit-counting cow algorithm
      - A history log for deduction
    requires:
      - module: quiz-master
        thread: Reading a world
        why: you stored answers in an array; here you compare two of them
    status: complete
  - number: 12
    slug: sonar
    name: Sonar
    tagline: Hunt by coordinates on a hidden grid
    phase: Patterns of State
    skills:
      - Two-dimensional arrays (DIM g(8,8))
      - Probing by coordinate
      - Manhattan distance with ABS
      - Colour-coded clues
    requires:
      - module: quiz-master
        thread: Reading a world
        why: you indexed an array by number; here the number is a coordinate
    status: complete
  - number: 13
    slug: three-in-a-row
    name: Three in a Row
    tagline: The computer plays against you
    phase: Patterns of State
    skills:
      - Win detection from a DATA line table
      - Reusable GO SUB board checks
      - Game AI as a priority of rules (win, block, strategy)
      - Why sound play forces a draw
    requires:
      - module: sonar
        thread: Reading a world
        why: you read a grid to find something; here you read it to decide who won
      - module: cipher
        thread: Where the data lives
        why: you kept content in DATA; here it holds every winning line
    status: complete
  - number: 14
    slug: the-caverns
    name: The Caverns
    tagline: Fear of the unseen — atmosphere through hidden information
    phase: Patterns of State
    skills:
      - A graph in parallel arrays (DATA-loaded)
      - Navigation by following links
      - Hidden state sensed by adjacency
      - A moving hazard and indirect clues
    requires:
      - module: sonar
        thread: Reading a world
        why: you probed a grid you could not see; here the dark answers back
      - module: three-in-a-row
        thread: Reading a world
        why: you taught the machine to judge a board; here it hunts you across one
    status: complete
  - number: 15
    slug: yearfall
    name: Yearfall
    tagline: Choices land later — resource management
    phase: Patterns of State
    skills:
      - Persistent multi-variable state
      - Allocation under constraints
      - A random harvest you cannot control
      - Delayed, compounding consequences
    requires:
      - module: dice-roller
        thread: Chance and its consequences
        why: you watched randomness even out over a hundred rolls; here it does not
      - module: three-in-a-row
        thread: Reading a world
        why: you held a whole board in state; here the state is a farm and it remembers
    status: complete
  - number: 16
    slug: crates
    name: Crates
    tagline: Push crates to targets — the mechanic is the game
    phase: Patterns of State
    skills:
      - A 2D array as the writable world
      - DATA-string level layouts
      - Real-time movement with INKEY$
      - A push built from a two-cell lookahead
    requires:
      - module: sonar
        thread: Reading a world
        why: you learned to read a 2D grid; Crates writes to one
      - module: touchdown
        thread: Moving in real time
        why: you made something move on its own; here the crates push back
      - module: cipher
        thread: Where the data lives
        why: you loaded content from DATA; here it is the level itself
    status: complete
  # Volume 3 — Worlds and Rules
  - number: 17
    slug: tail-chase
    name: Tail Chase
    tagline: The snake moves — you steer
    phase: Worlds and Rules
    skills:
