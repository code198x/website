    status: coming-soon
  - number: 24
    slug: blockstorm
    name: Blockstorm
    tagline: Faster than BASIC should allow
    phase: Worlds and Rules
    skills:
      - UDG animation
      - Difficulty curves
      - Speed optimisation
    status: coming-soon
