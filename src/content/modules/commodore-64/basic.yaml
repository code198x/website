platform: commodore-64
track: basic
modules:
  # Primer — the on-ramp, before Volume 1
  - number: 0
    slug: meet-c64-basic
    name: Meet C64 BASIC
    kind: teaching
    tagline: Write, run, edit and debug Commodore BASIC for real — and meet the screen, colour, sound and input the C64 reaches only by POKE and PEEK.
    phase: Primer
    skills:
      - Typing and editing a program
      - PRINT, LET, INPUT
      - IF/THEN, FOR/NEXT, GOTO / GOSUB
      - The screen, colour, sound and joystick by POKE/PEEK
    status: complete
  # Volume 1 — First Programs
  - number: 1
    slug: skyline
    name: Skyline
    tagline: Build a city by writing straight to the screen
    phase: First Programs
    skills:
      - POKE to screen memory
      - The separate colour RAM
      - Screen codes
    status: complete
  - number: 2
    slug: oracle
    name: Oracle
    tagline: Ask a question, get an answer from the machine
    phase: First Programs
    skills:
      - RND
      - INPUT
      - IF/THEN
    status: complete
  - number: 3
    slug: reflex
    name: Reflex
    tagline: How fast can you press a key?
    phase: First Programs
    skills:
      - The jiffy clock (TI)
      - Border flash (POKE 53280)
      - Timing loops
    status: coming-soon
  - number: 4
    slug: tally
    name: Tally
    tagline: Keep score — counters that climb
    phase: First Programs
    skills:
      - Accumulators
      - A POKEd bar chart
      - PRINT formatting
    status: coming-soon
  - number: 5
    slug: bleeper
    name: Bleeper
    tagline: Make the SID chip play a tune you must repeat
    phase: First Programs
    skills:
      - SID registers
      - Sequences in arrays
      - Memory and recall
    status: coming-soon
  - number: 6
    slug: safe-cracker
    name: Safe Cracker
    tagline: Crack the code by narrowing it down
    phase: First Programs
    skills:
      - High/low search
      - Colour-coded feedback
      - Guess limits
    status: coming-soon
  - number: 7
    slug: rover
    name: Rover
    tagline: Drive a rover around the screen with a joystick
    phase: First Programs
    skills:
      - Joystick (PEEK 56320)
      - The continuous game loop
      - Move-and-bump collision
    status: coming-soon
  - number: 8
    slug: dropzone
    name: Dropzone
    tagline: Fight gravity to land safely
    phase: First Programs
    skills:
      - Gravity and thrust
      - The full game loop
      - Win and lose states
    status: coming-soon
