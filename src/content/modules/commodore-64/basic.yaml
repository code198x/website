platform: commodore-64
track: basic
modules:
  # Primer — the on-ramp, before Volume 1
  - number: 0
    slug: meet-c64-basic
    name: Meet C64 BASIC
    kind: teaching
    tagline: Write, run, edit and debug Commodore BASIC for real — and meet the screen, colour, sound and input the C64 reaches only by POKE and PEEK.
    thumbnail: /images/commodore-64/basic/meet-c64-basic/unit-03/step-03-titlecard.png
    phase: Primer
    skills:
      - Typing and editing a program
      - PRINT, LET, INPUT
      - IF/THEN, FOR/NEXT, GOTO / GOSUB
      - The screen, colour, sound and joystick by POKE/PEEK
    status: complete
  # Volume 1 — First Programs
  - number: 1
    slug: skyline
    name: Skyline
    tagline: Build a city by writing straight to the screen
    thumbnail: /images/commodore-64/basic/skyline/unit-06/skyline.png
    phase: First Programs
    skills:
      - POKE to screen memory
      - The separate colour RAM
      - Screen codes
    status: complete
  - number: 2
    slug: oracle
    name: Oracle
    tagline: Ask a question, get an answer from the machine
    thumbnail: /images/commodore-64/basic/oracle/unit-06/oracle.png
    phase: First Programs
    skills:
      - RND
      - INPUT
      - IF/THEN
    status: complete
  - number: 3
    slug: reflex
    name: Reflex
    tagline: How fast can you press a key?
    thumbnail: /images/commodore-64/basic/reflex/unit-06/reflex.png
    phase: First Programs
    skills:
      - The jiffy clock (TI)
      - GET for an instant keypress
      - Screen flash (POKE 53281)
    status: complete
  - number: 4
    slug: tally
    name: Tally
    tagline: Roll two dice a thousand times and watch a bell curve appear
    thumbnail: /images/commodore-64/basic/tally/unit-06/tally.png
    phase: First Programs
    skills:
      - Numeric arrays as counters
      - The roll value as an index
      - A POKEd bar chart
    status: complete
  - number: 5
    slug: bleeper
    name: Bleeper
    tagline: Make the SID chip play a tune you must repeat
    thumbnail: /images/commodore-64/basic/bleeper/unit-06/bleeper.png
    phase: First Programs
    skills:
      - SID registers as a voice
      - A sequence stored in an array
      - GET to read and check the echo
    status: complete
  - number: 6
    slug: safe-cracker
    name: Safe Cracker
    tagline: Crack the code by narrowing it down
    thumbnail: /images/commodore-64/basic/safe-cracker/unit-06/safe-cracker.png
    phase: First Programs
    skills:
      - The loop-with-a-goal
      - Higher/lower deduction
      - Colour feedback and a guess limit
    status: complete
  - number: 7
    slug: rover
    name: Rover
    tagline: Drive a rover around the screen with a joystick
    thumbnail: /images/commodore-64/basic/rover/unit-06/rover.png
    phase: First Programs
    skills:
      - Joystick (PEEK 56320)
      - The continuous game loop
      - Look-ahead collision
    status: complete
  - number: 8
    slug: dropzone
    name: Dropzone
    tagline: Fight gravity to land safely
    thumbnail: /images/commodore-64/basic/dropzone/unit-06/dropzone.png
    phase: First Programs
    skills:
      - Velocity, gravity and thrust
      - The continuous physics loop
      - Win, lose, and a fuel squeeze
    status: complete
  # Volume 2 — Boards and Sprites
  - number: 9
    slug: gridlock
    name: Gridlock
    tagline: Hold a whole board in memory and reason over it
    phase: Boards and Sprites
    skills:
      - 2D arrays as a board
      - Row and column indexing
      - Turn-based rules
    status: coming-soon
  - number: 10
    slug: codebreaker
    name: Codebreaker
    tagline: Guess the word, letter by letter
    phase: Boards and Sprites
    skills:
      - String handling (LEFT$/MID$/LEN)
      - Comparing letters
      - The guess grid
    status: coming-soon
  - number: 11
    slug: meet-the-vic-ii
    name: Meet the VIC-II
    kind: teaching
    tagline: Meet the chip behind the C64's graphics — charset, sprites and colour, reached by POKE and PEEK, before you build with them.
    phase: Boards and Sprites
    skills:
      - The VIC-II memory map
      - Copying the charset to RAM
      - Sprite registers — enable, position, pointer
      - Colour and the screen
    status: coming-soon
  - number: 12
    slug: glyph
    name: Glyph
    tagline: Redefine the font and build a world from it
    phase: Boards and Sprites
    skills:
      - Custom characters (charset to RAM)
      - A redefined tileset
      - Screen and colour RAM
    status: coming-soon
  - number: 13
    slug: skater
    name: Skater
    tagline: Your first hardware sprite, steered by joystick
    phase: Boards and Sprites
    skills:
      - Hardware sprites — enable, position, pointer
      - The joystick loop
      - A custom-char background
    status: coming-soon
  - number: 14
    slug: nibbler
    name: Nibbler
    tagline: Hunt and be hunted in a maze
    phase: Boards and Sprites
    skills:
      - Game states (chase and flee)
      - A grid mover
      - Sprites over a 2D map
    status: coming-soon
  - number: 15
    slug: bouncer
    name: Bouncer
    tagline: Bat, ball and bricks — let the hardware spot the hits
    phase: Boards and Sprites
    skills:
      - Sprite collision registers
      - A brick grid
      - Ball physics
    status: coming-soon
  - number: 16
    slug: treasure-map
    name: Treasure Map
    tagline: Rooms and items as data you read at runtime
    phase: Boards and Sprites
    skills:
      - READ/DATA
      - Rooms and items as tables
      - Custom chars and sprites
    status: coming-soon
  - number: 17
    slug: quizmaster
    name: Quizmaster
    tagline: A game show with menus and a question bank
    phase: Boards and Sprites
    skills:
      - Menus and multi-state flow
      - A DATA-driven question bank
      - Strings and arrays
    status: coming-soon
  # Volume 3 — Worlds and Sound
  - number: 18
    slug: vectors
    name: Vectors
    tagline: Thrust in the direction you're facing
    phase: Worlds and Sound
    skills:
      - SIN/COS for motion
      - Angle to dx/dy
      - Sprites and the game loop
    status: coming-soon
  - number: 19
    slug: cascade
    name: Cascade
    tagline: Blocks fall, settle and clear
    phase: Worlds and Sound
    skills:
      - Gravity over a grid
      - 2D arrays and state
      - Custom characters
    status: coming-soon
  - number: 20
    slug: soundsmith
    name: Soundsmith
    tagline: Three voices and a tune that plays under the game
    phase: Worlds and Sound
    skills:
      - The full SID — three voices, ADSR, filter
      - Music and SFX together
      - DATA-driven sequences
    status: coming-soon
  - number: 21
    slug: raster
    name: Raster
    tagline: Read the beam for flicker-free updates
    phase: Worlds and Sound
    skills:
      - Raster reads (D012)
      - Timed, flicker-free updates
      - Sprites and motion
    status: coming-soon
  - number: 22
    slug: defender-lite
    name: Defender Lite
    tagline: Many ships and a scrolling readout
    phase: Worlds and Sound
    skills:
      - Many sprites at once
      - A status readout
      - Collision and state
    status: coming-soon
  - number: 23
    slug: dungeon
    name: Dungeon
    tagline: Explore a generated dungeon, carry what you find
    phase: Worlds and Sound
    skills:
      - Procedural data
      - Inventory
      - Rooms, sprites and strings
    status: coming-soon
  - number: 24
    slug: trackside
    name: Trackside
    tagline: A road that rushes toward you
    phase: Worlds and Sound
    skills:
      - Pseudo-3D via characters
      - Motion maths
      - Collision
    status: coming-soon
  - number: 25
    slug: showtime
    name: Showtime
    tagline: Several tiny events in one programme
    phase: Worlds and Sound
    skills:
      - A multi-event collection
      - Sprites, SID, input and timing
      - Several small mechanics
    status: coming-soon
  # Volume 4 — Systems and Saves
  - number: 26
    slug: smooth-pt1
    name: Smooth
    tagline: The screen scrolls a pixel at a time
    phase: Systems and Saves
    skills:
      - Smooth scrolling (D016 fine scroll)
      - Coarse character shift
      - Sprites and chars
    status: coming-soon
  - number: 27
    slug: smooth-pt2
    name: Smooth (Part 2)
    tagline: A world wider than the screen
    phase: Systems and Saves
    skills:
      - A multi-screen world via scroll
      - Map data
      - Scrolling and state
    status: coming-soon
  - number: 28
    slug: vault-pt1
    name: Vault
    tagline: Save your progress to disk
    phase: Systems and Saves
    skills:
      - Persistence (OPEN/PRINT#/INPUT#)
      - Save and load
      - Rooms, strings and inventory
    status: coming-soon
  - number: 29
    slug: vault-pt2
    name: Vault (Part 2)
    tagline: Save the whole game state
    phase: Systems and Saves
    skills:
      - Saving full game state
      - The state machine
      - Persistence deepened
    status: coming-soon
  - number: 30
    slug: arena
    name: Arena
    tagline: Two fighters, frame by frame
    phase: Systems and Saves
    skills:
      - Two-sprite combat
      - Sprite animation frames
      - Collision and state
    status: coming-soon
  - number: 31
    slug: conductor
    name: Conductor
    tagline: Gameplay that moves to the music
    phase: Systems and Saves
    skills:
      - SID-synced gameplay
      - Raster timing
      - State
    status: coming-soon
  - number: 32
    slug: builder
    name: Builder
    tagline: Build something and keep it
    phase: Systems and Saves
    skills:
      - A save-backed sandbox
      - Grids and READ/DATA
      - Persistence
    status: coming-soon
  - number: 33
    slug: showpiece
    name: Showpiece
    tagline: Everything you've learnt, in one game
    phase: Systems and Saves
    skills:
      - Sprites, scroll, SID and save
      - Integration of all techniques
      - Professional polish
    status: coming-soon
