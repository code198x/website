platform: commodore-amiga
track: blitz
modules:
  - number: 0
    slug: meet-blitz
    name: Meet Blitz
    kind: teaching
    tagline: The compiled-BASIC on-ramp — learn Blitz BASIC 2, the language the Amiga scene shipped real games in, from your first compile to graphics that run at full speed.
    skills:
      - The Ted editor and the compile-and-run loop
      - Amiga mode and Blitz mode
      - Slices, Shapes, and the Blitter
      - Compiled speed, scrolling, and reaching the hardware
    status: complete
  - number: 1
    slug: flashpoint
    name: Flashpoint
    kind: game
    tagline: A fast arcade shooter that shows what compiled Blitz does — many objects, smooth movement, full speed.
    skills:
      - Blitz-mode graphics at speed
      - The frame loop and the player
      - Collisions and scoring
    status: coming-soon
  - number: 2
    slug: gridlock
    name: Gridlock
    kind: game
    tagline: A structured puzzle game built around data — arrays, lists, and clean program structure in Blitz.
    skills:
      - Data modelling with arrays and lists
      - Structured programming in Blitz
      - Grid logic and state
    status: coming-soon
  - number: 3
    slug: tarmac
    name: Tarmac
    kind: game
    tagline: A top-down racer on smooth hardware scrolling — in the tradition of Super Skidmarks, which was built in Blitz BASIC 2.
    skills:
      - Smooth hardware scrolling
      - Fast object handling
      - Track and collision logic
    status: coming-soon
  - number: 4
    slug: star-drift
    name: Star Drift
    kind: game
    tagline: A horizontal shooter reaching past the picture — hardware sprites over a Copper-split background
    skills:
      - Hardware sprites (GetaSprite/ShowSprite)
      - A Copper split
      - Many objects at speed
      - Sprite and Copper tables
    status: coming-soon
  - number: 5
    slug: salvo
    name: Salvo
    kind: game
    tagline: Turn-based artillery over destructible terrain — the Scorched Earth tradition, with the Blitter as the mechanic
    skills:
      - The Blitter as the mechanic
      - Destructible terrain
      - Projectile arcs and wind
      - Shapes and collision
    status: coming-soon
  - number: 6
    slug: skyfire
    name: Skyfire
    kind: game
    tagline: A parallax shoot-'em-up at full speed — dual-playfield layers feeding off compiled Blitz
    skills:
      - Dual-playfield parallax
      - Hardware sprites over layers
      - Compiled speed under load
      - The Blitz climax
    status: coming-soon
  - number: 7
    slug: overdrive
    name: Overdrive
    kind: game
    tagline: The capstone — a multi-layer racer/action game that ties every Blitz power together
    skills:
      - Multi-layer hardware
      - Sprites and parallax
      - A full game loop
      - Integrate and polish
    status: coming-soon
