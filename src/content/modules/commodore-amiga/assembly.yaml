platform: commodore-amiga
track: assembly
modules:
  - number: 0
    slug: meet-the-machine
    name: Meet the Machine
    kind: teaching
    tagline: The assembly on-ramp — meet the 68000 and the Amiga's custom chips one idea at a time, before you build a thing.
    skills:
      - The 68000 and MOVE
      - Data sizes and the register file
      - The bitmap screen and the Copper
      - The Blitter
    status: complete
  - number: 1
    slug: exodus
    name: Exodus
    tagline: Terrain puzzle where the Blitter is the gameplay — copy and cookie-cut pixels through the chip
    skills:
      - Blitter copy
      - Masked (cookie-cut) blits
      - Bitplane graphics
      - Terrain as the mechanic
    status: in-progress
  - number: 2
    slug: shatter-point
    name: Shatter Point
    tagline: Bat and ball with mood and sound — Copper splits and your first Paula samples
    skills:
      - Copper splits and gradients
      - Paula sample audio
      - Blitter draw
      - Ball physics
    status: coming-soon
  - number: 3
    slug: copper-dma
    name: How the Copper Works
    kind: interval
    tagline: A between-games demo — drive the Copper DMA by hand and watch it paint the screen, one scanline at a time
    skills:
      - The Copper as a co-processor
      - Copper DMA and the display list
      - WAIT and MOVE instructions
      - Colour by scanline
    status: coming-soon
  - number: 4
    slug: signal
    name: Signal
    tagline: A lane-crosser where the hazards are hardware sprites — the chip overlay, by hand
