section: craft
modules:
  - number: 1
    slug: maths-for-games
    name: Maths for Games
    kind: teaching
    status: in-progress
    tagline: Build a probability experiment or explore coordinates, triangles, trigonometry and fixed-point aiming. Further routes lead into vectors, matrices and 3D.
    skills:
      - Counts, shares and sample size
      - Live distributions and comparable samples
      - Fresh and accumulated experiments
      - Coordinates, triangles and trigonometry
      - Aiming and fixed-point movement
    requires: []
  - number: 2
    slug: game-feel
    name: Game Feel
    kind: teaching
    status: in-progress
    tagline: Explore four controls-and-response lessons with playable comparisons and inspectable code. Further sequences cover jumping, impact, cameras and recovery.
    skills:
      - Controls and response
      - Jumping and forgiveness
      - Impact and feedback
      - Cameras and attention
      - Readability and anticipation
      - Failure and recovery
    requires: []
  - number: 3
    slug: game-design
    name: Game Design
    kind: teaching
    status: coming-soon
    tagline: Shape rules, goals, choices and challenges. Explore levels, resources and progression, and test what makes a game interesting.
    skills: []
    requires: []
  - number: 4
    slug: game-ai
    name: Game AI
    kind: teaching
    status: coming-soon
    tagline: Build entities that perceive, remember and choose. Explore states, navigation, decision-making and coordination.
    skills: []
    requires: []
  - number: 5
    slug: game-data-and-algorithms
    name: Game Data and Algorithms
    kind: teaching
    status: coming-soon
    tagline: Represent worlds, entities and events. Compare grids, pools, spatial queries, histories and the cost of processing them.
    skills: []
    requires: []
  - number: 6
    slug: graphics-and-animation
    name: Graphics and Animation
    kind: teaching
    status: coming-soon
    tagline: Create and render images that communicate the game. Explore sprites, tiles, palettes, fonts, animation and how geometry becomes pixels.
    skills: []
