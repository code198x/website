extends: substitution
message: "Use '%s' instead of '%s' — short words beat long ones; tighten redundant phrases."
link: https://github.com/code198x/website/blob/main/styles/Code198x
level: suggestion
ignorecase: true
action:
  name: replace
# Left = pattern to flag (regex), right = the shorter/plainer form.
# Drawn from the Writing Principles: "short words beat long ones",
# "simplicity ≠ brevity", "tighten in sweeps". Deliberately omits
# domain-legitimate words (e.g. "initialise") that read fine in a
# programming curriculum.
swap:
  utili[sz]e: use
  utili[sz]ed: used
  utili[sz]es: uses
  demonstrate: show
  demonstrates: shows
  facilitate: help
  in order to: to
  in order for: for
  during the course of: during
  in the event that: if
  prior to: before
  subsequent to: after
  at this (point|moment) in time: now
  at the present time: now
  a number of: several
  the majority of: most
  in spite of the fact that: although
  due to the fact that: because
  the reason is because: because
  collaborate together: collaborate
  combine together: combine
  merge together: merge
  end result: result
  past history: history
  future plans: plans
