extends: existence
message: "'%s' — reads as condescending. If a step is easy, the reader will feel it; if it isn't, this word stings."
link: https://github.com/code198x/website/blob/main/styles/Code198x
level: suggestion
ignorecase: true
# The project voice is "never condescending". Words that tell a learner
# something is trivial backfire when they're stuck — exactly the moment they
# read the page. Flag them so we choose them deliberately, not by reflex.
tokens:
  - simply
  - merely
  - obviously
  - clearly
  - of course
  - easy
  - easily
  - simple
  - trivial
  - trivially
  - everyone knows
  - as you('| wi)ll know
