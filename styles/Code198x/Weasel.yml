extends: existence
message: "'%s' — filler/hedge. Cut it, or replace with something specific."
link: https://github.com/code198x/website/blob/main/styles/Code198x
level: suggestion
ignorecase: true
# "Non-essential information is an obstacle, not neutral." Intensifiers and
# hedges that add words without adding meaning. Not condescension (see
# Condescending.yml) — pure filler.
tokens:
  - very
  - really
  - quite
  - rather
  - somewhat
  - fairly
  - pretty much
  - kind of
  - sort of
  - a lot
  - lots of
  - actually
  - literally
  - essentially
  - in essence
  - at the end of the day
