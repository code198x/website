extends: existence
message: "'%s' may be passive voice — prefer active ('the CPU rejects the byte', not 'the byte is rejected')."
link: https://github.com/code198x/website/blob/main/styles/Code198x
level: suggestion
ignorecase: true
raw:
  - \b(am|are|were|being|is|been|was|be)\b\s*
