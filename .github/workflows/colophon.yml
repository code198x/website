# Keep the colophon's people list current.
#
# The list is derived from commit history across the organisation, which the
# site build cannot see — it checks out two repositories, not eight. So a
# scheduled run regenerates it here and opens a pull request.
#
# A pull request rather than a direct commit, deliberately: a new contributor
# appearing is worth seeing. It is also the only signal that someone new has
# arrived, which is a thing worth not missing.
#
# See Code198x docs/decisions/colophon.md
name: Colophon

on:
  schedule:
    # Weekly. The list changes when someone contributes, which is not daily.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The script shells out to `gh`, which is present on the runner and picks
      # up GITHUB_TOKEN from the environment.
      - name: Rebuild the contributor list
        run: node scripts/build-colophon.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `gh` rather than a third-party action: it is already on the runner, the
      # script already uses it, and this job holds write permissions — one less
      # supply-chain surface for a list of names.
      - name: Open a pull request if it changed
        run: |
          if git diff --quiet -- src/data/contributors.json; then
            echo "Contributor list unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B colophon/refresh
          git add src/data/contributors.json
          git commit -m "Refresh the colophon's contributor list"
          git push --force-with-lease origin colophon/refresh
          if [ -z "$(gh pr list --head colophon/refresh --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --head colophon/refresh \
              --title "Refresh the colophon's contributor list" \
              --body "Regenerated by \`scripts/build-colophon.mjs\` from commit history across the organisation's repositories. If this adds a name, someone new has contributed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
