name: Browser tests

# The Playwright suite, desktop and mobile, against the dev server: page
# frames, openings, the player, the assemblers, native images and
# accessibility. It needs no sibling checkout or Rust: the player, the NES
# assembler and the decoder are pinned npm packages (umbrella
# decisions/browser-bundles-ship-as-npm-packages.md), and code-samples is
# checked out for the lesson artefacts, as the deploy does.
#
# It runs when something that can change a page does; content-only changes
# (Vault entries, studies, lessons' prose) are covered by ci.yml's content
# checks. Plan: umbrella docs/plans/2026-10-19-ci-efficiency.md, A7.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.*'
      - 'playwright.config.*'
      - '.github/workflows/browser.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.*'
      - 'playwright.config.*'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Two parallel runs of the same setup: the suite against the dev server, and
  # the tests tagged @built against `astro preview`. Each has room to finish
  # when the runner is slow to install Chromium's system libraries.
  playwright:
    name: Playwright (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: [dev, built]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out code-samples
        uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          path: code-samples
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build unit artefacts
        run: ./scripts/build-artefacts.sh "${{ github.workspace }}/code-samples"

      # page-frame.spec.ts takes its route inventory from the built site, and
      # the build's own checks run here too.
      - name: Build the site
        env:
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples
        run: npm run build

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the browser suite
        if: matrix.server == 'dev'
        env:
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples
        run: npx playwright test

      # Tests tagged @built need the production build (search's index, for
      # one); they run against `astro preview` of the site built above.
      - name: Run the built-site tests
        if: matrix.server == 'built'
        env:
          PLAYWRIGHT_BUILT: '1'
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.server }}
          path: |
            playwright-report
            test-results
          retention-days: 14
