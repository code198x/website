name: Browser tests

# The Playwright suite, desktop and mobile, against the dev server: page
# frames, openings, the player, the assemblers, native images and
# accessibility. It needs no sibling checkout or Rust: the player, the NES
# assembler and the decoder are pinned npm packages (umbrella
# decisions/browser-bundles-ship-as-npm-packages.md), and code-samples is
# checked out for the lesson artefacts, as the deploy does.
#
# The suite runs when something that can change a page does; content-only
# changes (Vault entries, studies, lessons' prose) are covered by ci.yml's
# content checks. Plan: umbrella docs/plans/2026-10-19-ci-efficiency.md, A7.
#
# Pull requests always start this workflow, and the "Browser tests" job
# always reports. main's ruleset requires that job, so a red suite blocks the
# merge, and a pull request that skips the suite isn't left waiting for a
# check that never starts.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.*'
      - 'playwright.config.*'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the pull request touches anything that can change a page: the same
  # paths the push trigger lists. Pushes and manual runs always run the suite.
  changes:
    name: Page changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages: ${{ steps.files.outputs.pages }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files API lists at most 3,000 files; past that, run the suite.
          if [ "$CHANGED" -ge 3000 ]; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')
          [ "$(printf '%s\n' "$files" | grep -c .)" -eq "$CHANGED" ] || { echo "::error::Listed $(printf '%s\n' "$files" | grep -c .) of $CHANGED changed files"; exit 1; }
          if printf '%s\n' "$files" | grep -Eq '^(src/|public/|tests/|scripts/|package\.json$|package-lock\.json$|astro\.config\.|playwright\.config\.|\.github/workflows/browser\.yml$)'; then
            echo "pages=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages=false" >> "$GITHUB_OUTPUT"
          fi

  # Two parallel runs of the same setup: the suite against the dev server, and
  # the tests tagged @built against `astro preview`. Each has room to finish
  # when the runner is slow to install Chromium's system libraries.
  playwright:
    name: Playwright (${{ matrix.server }})
    needs: changes
    if: needs.changes.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        server: [dev, built]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out code-samples
        uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          path: code-samples
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build unit artefacts
        run: ./scripts/build-artefacts.sh "${{ github.workspace }}/code-samples"

      # page-frame.spec.ts takes its route inventory from the built site, and
      # the build's own checks run here too.
      - name: Build the site
        env:
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples
        run: npm run build

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the browser suite
        if: matrix.server == 'dev'
        env:
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples
        run: npx playwright test

      # Tests tagged @built need the production build (search's index, for
      # one); they run against `astro preview` of the site built above.
      - name: Run the built-site tests
        if: matrix.server == 'built'
        env:
          PLAYWRIGHT_BUILT: '1'
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.server }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  # The one check main's ruleset requires. It passes when the suite passed, or
  # when the pull request changes nothing the suite covers, and fails otherwise.
  gate:
    name: Browser tests
    needs: [changes, playwright]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          PAGES: ${{ needs.changes.outputs.pages }}
          SUITE: ${{ needs.playwright.result }}
        run: |
          echo "Page changes: $CHANGES (pages=$PAGES); Playwright: $SUITE"
          [ "$CHANGES" = success ] || exit 1
          if [ "$PAGES" = true ]; then [ "$SUITE" = success ]; else [ "$SUITE" = skipped ]; fi
