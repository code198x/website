name: Workflow lint

# The family's shared actionlint check (stevehill1981/198x-workflows), with
# pinned shellcheck. Findings accepted on purpose go in .github/actionlint.yaml.
# It only has something to say when workflows change, so it runs only then.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows
    uses: stevehill1981/198x-workflows/.github/workflows/workflow-lint.yml@v1
