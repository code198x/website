name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ code-samples-updated ]
  workflow_dispatch:
  schedule:
    # Daily rebuild (06:00 UTC) so date-gated content — the weekly From the Metal
    # drip — publishes on schedule without a manual deploy. Each piece goes live
    # within hours of midnight on its pubDate.
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Checkout code-samples
        uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          path: code-samples

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build unit artefacts
        run: ./scripts/build-artefacts.sh "${{ github.workspace }}/code-samples"

      - name: Build site
        run: npm run build
        env:
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
