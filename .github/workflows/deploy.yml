name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ code-samples-updated ]
  workflow_dispatch:
  schedule:
    # Daily rebuild (06:00 UTC) so date-gated content — the weekly From the Metal
    # drip — publishes on schedule without a manual deploy. Each piece goes live
    # within hours of midnight on its pubDate.
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout website
        uses: actions/checkout@v7

      - name: Checkout code-samples
        uses: actions/checkout@v7
        with:
          repository: code198x/code-samples
          path: code-samples

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Must happen before the deploy replaces it. This is the feed as readers
      # see it right now; comparing it with the one built below is what makes
      # "newly live" computable without keeping any state between runs.
      # Failure is tolerated and handled downstream: the diff script announces
      # nothing rather than treating an unreadable feed as an empty one.
      - name: Fetch the currently live feed
        run: curl -sS --fail --max-time 30 -o old-rss.xml https://code198x.com/rss.xml || true
        continue-on-error: true

      - name: Build unit artefacts
        run: ./scripts/build-artefacts.sh "${{ github.workspace }}/code-samples"

      # The player, the NES assembler and the decoder are npm dependencies,
      # built once by their producers and pinned in package.json (umbrella
      # decisions/browser-bundles-ship-as-npm-packages.md), so nothing here
      # compiles Rust or needs the Spectrum ROM secret.
      - name: Stage and check the pinned browser bundles
        run: |
          npm run bundles
          node scripts/check-browser-player.mjs
          node scripts/check-nes-assembler.mjs

      - name: Build site
        run: npm run build
        env:
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples

      # Save only after Astro has also consumed the prepared bundles.
      - name: Work out what became newly live
        run: |
          python3 scripts/discord-new-items.py \
            --old old-rss.xml \
            --new dist/rss.xml \
            --out new-items.json
          python3 scripts/discord-payloads.py --items new-items.json --out discord-payloads.json

      # Carried to the announce job rather than posted here: nothing should be
      # announced until the deploy it describes has actually succeeded.
      - name: Upload the newly-live list
        uses: actions/upload-artifact@v5
        with:
          name: new-items
          path: |
            new-items.json
            discord-payloads.json
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Announce in Discord what this deploy made live.
  #
  # Runs only after a successful deploy, so nothing is announced that readers
  # cannot yet reach. `if: success()` is implicit in `needs`, but the deploy
  # job is the gate that matters and is named explicitly for that reason.
  announce:
    name: Announce new content in Discord
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: Download the newly-live list
        uses: actions/download-artifact@v8
        with:
          name: new-items

      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          WEBHOOK_ALL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_ALL }}
        run: |
          set -euo pipefail

          # Built with `if` rather than `[ -n "$x" ] && arr+=(...)`: under
          # `set -e` a failing test at the end of a command list exits the step,
          # so the shorter form would abort whenever a secret is unset.
          targets=()
          if [ -n "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK")
          fi
          # Skip an aggregate pointed at the same channel, so a single-channel
          # setup that fills both secrets does not post twice.
          if [ -n "${WEBHOOK_ALL}" ] && [ "${WEBHOOK_ALL}" != "${WEBHOOK}" ]; then
            targets+=("$WEBHOOK_ALL")
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "::notice::no Discord webhook secret set — nothing posted."
            exit 0
          fi

          count=$(jq '[.[].embeds | length] | add // 0' discord-payloads.json)
          if [ "$count" = "0" ]; then
            echo "Nothing became newly live in this deploy."
            exit 0
          fi

          # Payloads were validated before deployment and retained with the feed
          # diff. Read one JSON message per line; never construct URLs in shell.
          failed=0
          while IFS= read -r payload; do
            printf '%s' "$payload" > payload.json
            for target in "${targets[@]}"; do
              if ! curl --silent --show-error --fail-with-body \
                        --retry 3 --retry-delay 5 \
                        --connect-timeout 10 --max-time 30 \
                        -H "Content-Type: application/json" \
                        -X POST -d @payload.json "$target"; then
                failed=1
              fi
            done
          done < <(jq -c '.[]' discord-payloads.json)

          if [ "$failed" -ne 0 ]; then
            echo "::error::at least one Discord post failed. Inspect channel delivery before retrying: successful messages may be duplicated. The next deploy does not replay this list."
            exit 1
          fi

          echo "Announced ${count} item(s) to ${#targets[@]} Discord channel(s)."
