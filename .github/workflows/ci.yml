name: CI Pipeline (Simplified)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Essential Quality Checks
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: TypeScript check
        run: npx astro check

      - name: Run unit tests
        run: npm run test:run

      - name: Build site
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # Optional: Security Scan (basic)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "❌ Essential tests failed"
            exit 1
          fi

          echo "✅ Essential tests passed"

      - name: Generate summary
        run: |
          echo "# CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-and-test.result }}" = "success" ]; then
            echo "✅ **Build & Test**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build & Test**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.security.result }}" = "success" ]; then
            echo "✅ **Security**: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.security.result }}" = "failure" ]; then
            echo "⚠️ **Security**: ISSUES FOUND (non-blocking)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Security**: SKIPPED" >> $GITHUB_STEP_SUMMARY
          fi
