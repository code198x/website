name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout code-samples
        uses: actions/checkout@v4
        with:
          repository: code198x/code-samples
          path: code-samples

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          CODE_SAMPLES_PATH: ${{ github.workspace }}/code-samples

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --root-dir ${{ github.workspace }}/dist
            --no-progress
            --exclude-path ${{ github.workspace }}/dist/assets
            --exclude 'mailto:.*'
            --exclude 'localhost'
            --exclude '/images/'
            --offline
            '${{ github.workspace }}/dist/**/*.html'
          fail: true

      - name: Link check results
        if: failure()
        run: |
          echo "Broken links detected! See the lychee output above for details."
          echo "Fix all broken internal links before merging."
