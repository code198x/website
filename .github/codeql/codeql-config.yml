name: "Code198x CodeQL Config"

disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality

paths-ignore:
  - node_modules/
  - dist/
  - coverage/
  - playwright-report/
  - test-results/
  - .lighthouseci/
  - bundle-analysis/

paths:
  - src/
  - scripts/
  - tests/

query-filters:
  - exclude:
      id: js/unused-local-variable
  - exclude:
      id: js/debugger-statement
