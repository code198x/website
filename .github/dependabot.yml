# Dependabot version updates.
#
# npm covers the site's dependencies, including the browser bundles the 198x
# producers publish (@emu198x/player, @asm198x/*, @play198x/web), which are
# pinned exactly: a new producer release arrives here as a pull request whose
# checks run before it deploys (umbrella
# decisions/browser-bundles-ship-as-npm-packages.md). github-actions covers the
# workflows, including the shared stevehill1981/198x-workflows tag.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      # The producers' bundles arrive one at a time, so each bump is reviewed
      # on its own; everything else groups by minor and patch.
      npm-minor-patch:
        exclude-patterns:
          - "@emu198x/*"
          - "@asm198x/*"
          - "@play198x/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
