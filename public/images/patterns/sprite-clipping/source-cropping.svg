<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="title desc">
<title id="title">One visible column, two different source offsets</title>
<desc id="desc">At x minus one the first source column A is outside the left edge, so column B survives at destination zero. At x thirty-one, column A survives while B is outside the right edge of a thirty-two-column viewport.</desc>
<rect width="900" height="330" fill="#f7f5ef"/>
<g font-family="sans-serif" fill="#24231f">
<text x="28" y="35" font-size="24" font-weight="700">Same visible width. Different source pixels.</text>
<text x="28" y="72" font-size="19">Source: two columns, A then B</text>
<text x="28" y="114" font-size="21" font-weight="700">X = −1</text>
<text x="478" y="114" font-size="21" font-weight="700">X = 31</text>
<path d="M140 130V240H422M478 240H680V130" stroke="#24231f" stroke-width="3" fill="none"/>
<rect x="70" y="153" width="68" height="64" fill="none" stroke="#ac3d07" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="142" y="153" width="68" height="64" fill="#007b83"/>
<rect x="610" y="153" width="68" height="64" fill="#ac3d07"/>
<rect x="682" y="153" width="68" height="64" fill="none" stroke="#007b83" stroke-width="2" stroke-dasharray="6 4"/>
<g font-size="28" font-weight="700" text-anchor="middle"><text x="104" y="194" fill="#ac3d07">A</text><text x="176" y="194" fill="#fff">B</text><text x="644" y="194" fill="#fff">A</text><text x="716" y="194" fill="#007b83">B</text></g>
<g font-size="18"><text x="152" y="265">Left edge: 0</text><text x="548" y="265">Right edge: 32</text><text x="28" y="309">Skip 1 source column; draw B at 0.</text><text x="478" y="309">Skip 0 source columns; draw A at 31.</text></g>
</g></svg>
