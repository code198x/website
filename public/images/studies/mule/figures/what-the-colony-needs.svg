<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="370" viewBox="0 0 1120 370" role="img" aria-labelledby="title"><title id="title">Food, energy, smithore and crystite have different roles</title><rect width="1120" height="370" rx="12" fill="#142635"/><g font-family="Arial, sans-serif"><text x="24" y="36" fill="#f5f1e5" font-size="23" font-weight="bold">WHAT THE COLONY NEEDS</text><rect x="25" y="80" width="250" height="155" rx="8" fill="#254152"/><text x="39" y="113" fill="#ffcf70" font-size="21" font-weight="bold">FOOD</text><text x="39" y="158" fill="#f5f1e5" font-size="21" font-weight="normal">Time to develop</text><text x="39" y="205" fill="#bed0d5" font-size="16" font-weight="normal">Shortage limits your turn.</text><rect x="300" y="80" width="250" height="155" rx="8" fill="#254152"/><text x="314" y="113" fill="#ffcf70" font-size="21" font-weight="bold">ENERGY</text><text x="314" y="158" fill="#f5f1e5" font-size="21" font-weight="normal">Working plots</text><text x="314" y="205" fill="#bed0d5" font-size="16" font-weight="normal">Production needs power.</text><rect x="575" y="80" width="250" height="155" rx="8" fill="#254152"/><text x="589" y="113" fill="#ffcf70" font-size="21" font-weight="bold">SMITHORE</text><text x="589" y="158" fill="#f5f1e5" font-size="21" font-weight="normal">More M.U.L.E.s</text><text x="589" y="205" fill="#bed0d5" font-size="16" font-weight="normal">Standard / Tournament.</text><rect x="850" y="80" width="250" height="155" rx="8" fill="#254152"/><text x="864" y="113" fill="#ffcf70" font-size="21" font-weight="bold">CRYSTITE</text><text x="864" y="158" fill="#f5f1e5" font-size="21" font-weight="normal">Export income</text><text x="864" y="205" fill="#bed0d5" font-size="16" font-weight="normal">Tournament only.</text><text x="24" y="342" fill="#bed0d5" font-size="15" font-weight="normal">Roles and dependencies • not a full economy model</text></g></svg>
