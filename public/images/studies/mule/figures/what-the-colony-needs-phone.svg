<svg xmlns="http://www.w3.org/2000/svg" width="400" height="860" viewBox="0 0 400 860" role="img" aria-labelledby="title"><title id="title">Food, energy, smithore and crystite have different roles</title><rect width="400" height="860" rx="12" fill="#142635"/><g font-family="Arial, sans-serif"><text x="24" y="36" fill="#f5f1e5" font-size="23" font-weight="bold">WHAT THE COLONY NEEDS</text><rect x="25" y="70" width="350" height="155" rx="8" fill="#254152"/><text x="39" y="103" fill="#ffcf70" font-size="21" font-weight="bold">FOOD</text><text x="39" y="148" fill="#f5f1e5" font-size="21" font-weight="normal">Time to develop</text><text x="39" y="195" fill="#bed0d5" font-size="16" font-weight="normal">Shortage limits your turn.</text><rect x="25" y="255" width="350" height="155" rx="8" fill="#254152"/><text x="39" y="288" fill="#ffcf70" font-size="21" font-weight="bold">ENERGY</text><text x="39" y="333" fill="#f5f1e5" font-size="21" font-weight="normal">Working plots</text><text x="39" y="380" fill="#bed0d5" font-size="16" font-weight="normal">Production needs power.</text><rect x="25" y="440" width="350" height="155" rx="8" fill="#254152"/><text x="39" y="473" fill="#ffcf70" font-size="21" font-weight="bold">SMITHORE</text><text x="39" y="518" fill="#f5f1e5" font-size="21" font-weight="normal">More M.U.L.E.s</text><text x="39" y="565" fill="#bed0d5" font-size="16" font-weight="normal">Standard / Tournament.</text><rect x="25" y="625" width="350" height="155" rx="8" fill="#254152"/><text x="39" y="658" fill="#ffcf70" font-size="21" font-weight="bold">CRYSTITE</text><text x="39" y="703" fill="#f5f1e5" font-size="21" font-weight="normal">Export income</text><text x="39" y="750" fill="#bed0d5" font-size="16" font-weight="normal">Tournament only.</text><text x="24" y="832" fill="#bed0d5" font-size="15" font-weight="normal">Roles and dependencies • not a full economy model</text></g></svg>
