<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title"><title id="title">A buyer and seller close the gap between their offers</title><rect width="1120" height="430" rx="12" fill="#142635"/><g font-family="Arial, sans-serif"><text x="24" y="36" fill="#f5f1e5" font-size="23" font-weight="bold">MEET AT A PRICE</text><text x="60" y="90" fill="#f5f1e5" font-size="23" font-weight="bold">Offers apart</text><text x="60" y="155" fill="#ffb16f" font-size="20" font-weight="normal">Seller</text><line x1="155" y1="148" x2="335" y2="148" stroke="#ffb16f" stroke-width="3"/><text x="342" y="155" fill="#ffb16f" font-size="23" font-weight="bold">50</text><text x="60" y="245" fill="#60d6da" font-size="20" font-weight="normal">Buyer</text><line x1="155" y1="238" x2="335" y2="238" stroke="#60d6da" stroke-width="3"/><text x="342" y="245" fill="#60d6da" font-size="23" font-weight="bold">30</text><text x="60" y="334" fill="#f5f1e5" font-size="18" font-weight="normal">No shared price. No sale.</text><text x="610" y="90" fill="#f5f1e5" font-size="23" font-weight="bold">One unit trades</text><text x="610" y="155" fill="#ffb16f" font-size="20" font-weight="normal">Seller</text><line x1="705" y1="148" x2="885" y2="148" stroke="#ffb16f" stroke-width="3"/><text x="892" y="155" fill="#ffb16f" font-size="23" font-weight="bold">40</text><text x="610" y="245" fill="#60d6da" font-size="20" font-weight="normal">Buyer</text><line x1="705" y1="238" x2="885" y2="238" stroke="#60d6da" stroke-width="3"/><text x="892" y="245" fill="#60d6da" font-size="23" font-weight="bold">40</text><text x="610" y="334" fill="#f5f1e5" font-size="18" font-weight="normal">Both agree to 40 per unit.</text><text x="24" y="406" fill="#bed0d5" font-size="15" font-weight="normal">Invented bids • not a captured match</text></g></svg>
