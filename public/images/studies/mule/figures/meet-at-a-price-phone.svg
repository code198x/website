<svg xmlns="http://www.w3.org/2000/svg" width="400" height="850" viewBox="0 0 400 850" role="img" aria-labelledby="title"><title id="title">A buyer and seller close the gap between their offers</title><rect width="400" height="850" rx="12" fill="#142635"/><g font-family="Arial, sans-serif"><text x="24" y="36" fill="#f5f1e5" font-size="23" font-weight="bold">MEET AT A PRICE</text><text x="35" y="85" fill="#f5f1e5" font-size="23" font-weight="bold">Offers apart</text><text x="35" y="150" fill="#ffb16f" font-size="20" font-weight="normal">Seller</text><line x1="130" y1="143" x2="310" y2="143" stroke="#ffb16f" stroke-width="3"/><text x="317" y="150" fill="#ffb16f" font-size="23" font-weight="bold">50</text><text x="35" y="240" fill="#60d6da" font-size="20" font-weight="normal">Buyer</text><line x1="130" y1="233" x2="310" y2="233" stroke="#60d6da" stroke-width="3"/><text x="317" y="240" fill="#60d6da" font-size="23" font-weight="bold">30</text><text x="35" y="329" fill="#f5f1e5" font-size="18" font-weight="normal">No shared price. No sale.</text><text x="35" y="435" fill="#f5f1e5" font-size="23" font-weight="bold">One unit trades</text><text x="35" y="500" fill="#ffb16f" font-size="20" font-weight="normal">Seller</text><line x1="130" y1="493" x2="310" y2="493" stroke="#ffb16f" stroke-width="3"/><text x="317" y="500" fill="#ffb16f" font-size="23" font-weight="bold">40</text><text x="35" y="590" fill="#60d6da" font-size="20" font-weight="normal">Buyer</text><line x1="130" y1="583" x2="310" y2="583" stroke="#60d6da" stroke-width="3"/><text x="317" y="590" fill="#60d6da" font-size="23" font-weight="bold">40</text><text x="35" y="679" fill="#f5f1e5" font-size="18" font-weight="normal">Both agree to 40 per unit.</text><text x="24" y="826" fill="#bed0d5" font-size="15" font-weight="normal">Invented bids • not a captured match</text></g></svg>
