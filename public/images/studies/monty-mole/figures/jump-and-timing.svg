<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">Jump distance and timing</title><desc id="desc">Three illustrative phases of a jump. A moving hazard can make an otherwise reachable landing unsafe.</desc><rect width="1120" height="430" fill="#071923"/><g fill="#fff8e9" font-family="Arial, sans-serif"><text x="28" y="45" font-size="26" fill="#fff8e9">A jump has two questions</text><text x="28" y="78" font-size="14" fill="#52d2cf">Original schematic · not a measured Monty arc</text><text x="28" y="120" font-size="23" fill="#fff8e9">Leave the edge</text><text x="28" y="148" font-size="16" fill="#fff8e9">Choose a take-off point.</text><path d="M28 250h75m80 0h150" stroke="#fff8e9" stroke-width="5" fill="none"/><path d="M68 245Q173 120 253 245" stroke="#52d2cf" stroke-width="3" stroke-dasharray="5 5" fill="none"/><circle cx="73" cy="238" r="8" fill="#52d2cf"/><text x="394" y="120" font-size="23" fill="#fff8e9">Clear the gap</text><text x="394" y="148" font-size="16" fill="#fff8e9">Height changes as you move.</text><path d="M394 250h75m80 0h150" stroke="#fff8e9" stroke-width="5" fill="none"/><path d="M434 245Q539 120 619 245" stroke="#52d2cf" stroke-width="3" stroke-dasharray="5 5" fill="none"/><circle cx="534" cy="180" r="8" fill="#52d2cf"/><text x="760" y="120" font-size="23" fill="#fff8e9">Arrive safely</text><text x="760" y="148" font-size="16" fill="#fff8e9">Check where the hazard is now.</text><path d="M760 250h75m80 0h150" stroke="#fff8e9" stroke-width="5" fill="none"/><path d="M800 245Q905 120 985 245" stroke="#52d2cf" stroke-width="3" stroke-dasharray="5 5" fill="none"/><circle cx="985" cy="238" r="8" fill="#52d2cf"/><path d="M1025 220h40" stroke="#e8b04b" stroke-width="5"/><circle cx="1042" cy="236" r="8" fill="#e8b04b"/><text x="28" y="357" font-size="21" fill="#fff8e9">Distance alone is not enough: the landing place must be safe when you reach it.</text></g></svg>
