<svg xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680" role="img" aria-labelledby="title desc"><title id="title">Jump distance and timing</title><desc id="desc">Three illustrative phases of a jump. A moving hazard can make an otherwise reachable landing unsafe.</desc><rect width="420" height="680" fill="#071923"/><g fill="#fff8e9" font-family="Arial, sans-serif"><text x="28" y="45" font-size="26" fill="#fff8e9">A jump has two questions</text><text x="28" y="78" font-size="14" fill="#52d2cf">Original schematic · not a measured Monty arc</text><text x="28" y="120" font-size="23" fill="#fff8e9">Leave the edge</text><text x="28" y="148" font-size="16" fill="#fff8e9">Choose a take-off point.</text><path d="M28 250h75m80 0h150" stroke="#fff8e9" stroke-width="5" fill="none"/><path d="M68 245Q173 120 253 245" stroke="#52d2cf" stroke-width="3" stroke-dasharray="5 5" fill="none"/><circle cx="73" cy="238" r="8" fill="#52d2cf"/><text x="28" y="294" font-size="23" fill="#fff8e9">Clear the gap</text><text x="28" y="322" font-size="16" fill="#fff8e9">Height changes as you move.</text><path d="M28 424h75m80 0h150" stroke="#fff8e9" stroke-width="5" fill="none"/><path d="M68 419Q173 294 253 419" stroke="#52d2cf" stroke-width="3" stroke-dasharray="5 5" fill="none"/><circle cx="168" cy="354" r="8" fill="#52d2cf"/><text x="28" y="468" font-size="23" fill="#fff8e9">Arrive safely</text><text x="28" y="496" font-size="16" fill="#fff8e9">Check where the hazard is now.</text><path d="M28 598h75m80 0h150" stroke="#fff8e9" stroke-width="5" fill="none"/><path d="M68 593Q173 468 253 593" stroke="#52d2cf" stroke-width="3" stroke-dasharray="5 5" fill="none"/><circle cx="253" cy="586" r="8" fill="#52d2cf"/><path d="M293 568h40" stroke="#e8b04b" stroke-width="5"/><circle cx="310" cy="584" r="8" fill="#e8b04b"/><text x="28" y="655" font-size="19" fill="#fff8e9">Reach the ledge. Time the landing.</text></g></svg>
