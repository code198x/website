<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
<title id="title">From a held thrust control to a moving ship</title><desc id="desc">Holding thrust applies acceleration. Acceleration changes velocity; velocity changes position. Releasing thrust ends its acceleration contribution, not the motion already acquired. Gravity may still act.</desc>
<rect width="360" height="320" fill="#f7f5ef"/>
<defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#165b96"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a54412"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#126650"/></marker><marker id="neutral" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#25231f"/></marker></defs><g font-family="system-ui, sans-serif" font-size="18"><text x="180" y="35" fill="#25231f" text-anchor="middle">Hold the thrust control</text><path d="M180 47 l0 35" fill="none" stroke="#25231f" stroke-width="3" marker-end="url(#neutral)"/><text x="180" y="105" fill="#25231f" text-anchor="middle">Acceleration while held</text><path d="M180 117 l0 35" fill="none" stroke="#25231f" stroke-width="3" marker-end="url(#neutral)"/><text x="180" y="175" fill="#25231f" text-anchor="middle">Velocity changes</text><path d="M180 187 l0 35" fill="none" stroke="#25231f" stroke-width="3" marker-end="url(#neutral)"/><text x="180" y="245" fill="#25231f" text-anchor="middle">Position changes</text><text x="180" y="294" fill="#25231f" text-anchor="middle">Release thrust ≠ stop motion</text></g></svg>
