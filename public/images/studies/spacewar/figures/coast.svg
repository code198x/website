<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
<title id="title">Coast: facing up, moving right</title><desc id="desc">With thrust and gravity absent, a ship facing upwards moves equal distances right in equal time intervals. Its heading and velocity are different directions.</desc>
<rect width="360" height="320" fill="#f7f5ef"/>
<defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#165b96"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a54412"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#126650"/></marker><marker id="neutral" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#25231f"/></marker></defs><g font-family="system-ui, sans-serif" font-size="18"><text x="24" y="35" fill="#25231f" text-anchor="start">Coast</text><text x="24" y="69" fill="#25231f" text-anchor="start">Engine off · gravity left out</text><path d="M45 130 l-10 27 10-6 10 6 Z" fill="none" stroke="#25231f" stroke-width="2"/><text x="45" y="190" fill="#25231f" text-anchor="middle">0 s</text><path d="M130 130 l-10 27 10-6 10 6 Z" fill="none" stroke="#25231f" stroke-width="2"/><text x="130" y="190" fill="#25231f" text-anchor="middle">1 s</text><path d="M215 130 l-10 27 10-6 10 6 Z" fill="none" stroke="#25231f" stroke-width="2"/><text x="215" y="190" fill="#25231f" text-anchor="middle">2 s</text><path d="M300 130 l-10 27 10-6 10 6 Z" fill="none" stroke="#25231f" stroke-width="2"/><text x="300" y="190" fill="#25231f" text-anchor="middle">3 s</text><path d="M45 230 l255 0" fill="none" stroke="#165b96" stroke-width="3" marker-end="url(#blue)"/><text x="180" y="277" fill="#165b96" text-anchor="middle">Same velocity throughout</text></g></svg>
