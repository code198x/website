<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
<title id="title">Gravity changes velocity towards the star</title><desc id="desc">The ship has a rightward velocity. Gravity adds a down-right change pointing towards the star. The resulting velocity is down and right. These arrows show one velocity update, not the flight path.</desc>
<rect width="360" height="320" fill="#f7f5ef"/>
<defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#165b96"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a54412"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#126650"/></marker><marker id="neutral" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#25231f"/></marker></defs><g font-family="system-ui, sans-serif" font-size="18"><text x="24" y="35" fill="#25231f" text-anchor="start">Add gravity</text><path d="M60 110 l150 0" fill="none" stroke="#165b96" stroke-width="3" marker-end="url(#blue)"/><path d="M60 110 l80 56" fill="none" stroke="#a54412" stroke-width="3" marker-end="url(#orange)"/><path d="M210 110 l80 56" fill="none" stroke="#a54412" stroke-width="3" marker-end="url(#orange)" stroke-dasharray="5 5"/><path d="M60 110 l230 56" fill="none" stroke="#126650" stroke-width="3" marker-end="url(#green)"/><text x="78" y="86" fill="#165b96" text-anchor="start">Before</text><text x="24" y="200" fill="#a54412" text-anchor="start">Gravity change</text><text x="216" y="200" fill="#126650" text-anchor="start">After</text><circle cx="260" cy="250" r="17" fill="#a54412"/><circle cx="60" cy="110" r="4" fill="#25231f"/><text x="260" y="294" fill="#25231f" text-anchor="middle">Star</text></g></svg>
