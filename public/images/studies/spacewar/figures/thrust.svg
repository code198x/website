<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320" role="img" aria-labelledby="title desc">
<title id="title">Thrust adds an upward change to a rightward velocity</title><desc id="desc">The old velocity points right. An upward change from thrust is added at its tip. The resulting velocity points up and right from the same starting point.</desc>
<rect width="360" height="320" fill="#f7f5ef"/>
<defs><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#165b96"/></marker><marker id="orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#a54412"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#126650"/></marker><marker id="neutral" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#25231f"/></marker></defs><g font-family="system-ui, sans-serif" font-size="18"><text x="24" y="35" fill="#25231f" text-anchor="start">Add thrust</text><text x="34" y="76" fill="#126650" text-anchor="start">After: up + right</text><path d="M65 235 l210 0" fill="none" stroke="#165b96" stroke-width="3" marker-end="url(#blue)"/><path d="M275 235 l0 -140" fill="none" stroke="#a54412" stroke-width="3" marker-end="url(#orange)"/><path d="M65 235 l210 -140" fill="none" stroke="#126650" stroke-width="3" marker-end="url(#green)"/><text x="75" y="275" fill="#165b96" text-anchor="start">Before: right</text><text x="175" y="187" fill="#a54412" text-anchor="start">Thrust</text><text x="175" y="210" fill="#a54412" text-anchor="start">change</text></g></svg>
