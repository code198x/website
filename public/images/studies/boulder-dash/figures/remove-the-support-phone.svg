<svg xmlns="http://www.w3.org/2000/svg" width="400" height="960" viewBox="0 0 400 960" role="img" aria-labelledby="title"><title id="title">Digging removes support; wait beside the falling rock</title><rect width="400" height="960" rx="12" fill="#142635"/><g font-family="Arial, sans-serif"><text x="24" y="36" fill="#f5f1e5" font-size="23" font-weight="bold">REMOVE THE SUPPORT</text><text x="44" y="78" fill="#f5f1e5" font-size="22" font-weight="bold">1. Held up</text><rect x="44" y="90" width="36" height="36" rx="3" fill="#203b4d"/><rect x="82" y="90" width="36" height="36" rx="3" fill="#203b4d"/><rect x="120" y="90" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="138.0" cy="108.0" r="13.68" fill="#b4c9d0"/><rect x="158" y="90" width="36" height="36" rx="3" fill="#203b4d"/><rect x="196" y="90" width="36" height="36" rx="3" fill="#203b4d"/><rect x="44" y="128" width="36" height="36" rx="3" fill="#203b4d"/><rect x="82" y="128" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="100.0" cy="139" r="6" fill="#ffbe55"/><path d="M100.0 145v13m-9-9h18m-9 9-7 6m7-6 7 6" stroke="#ffbe55" stroke-width="4"/><rect x="120" y="128" width="36" height="36" rx="3" fill="#d6a15e"/><rect x="158" y="128" width="36" height="36" rx="3" fill="#203b4d"/><rect x="196" y="128" width="36" height="36" rx="3" fill="#203b4d"/><rect x="44" y="166" width="36" height="36" rx="3" fill="#203b4d"/><rect x="82" y="166" width="36" height="36" rx="3" fill="#203b4d"/><rect x="120" y="166" width="36" height="36" rx="3" fill="#203b4d"/><rect x="158" y="166" width="36" height="36" rx="3" fill="#203b4d"/><rect x="196" y="166" width="36" height="36" rx="3" fill="#203b4d"/><rect x="44" y="204" width="36" height="36" rx="3" fill="#638294"/><rect x="82" y="204" width="36" height="36" rx="3" fill="#638294"/><rect x="120" y="204" width="36" height="36" rx="3" fill="#638294"/><rect x="158" y="204" width="36" height="36" rx="3" fill="#638294"/><rect x="196" y="204" width="36" height="36" rx="3" fill="#638294"/><text x="44" y="276" fill="#f5f1e5" font-size="18" font-weight="normal">Dirt holds the rock.</text><text x="44" y="358" fill="#f5f1e5" font-size="22" font-weight="bold">2. Dig from beside it</text><rect x="44" y="370" width="36" height="36" rx="3" fill="#203b4d"/><rect x="82" y="370" width="36" height="36" rx="3" fill="#203b4d"/><rect x="120" y="370" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="138.0" cy="388.0" r="13.68" fill="#b4c9d0"/><rect x="158" y="370" width="36" height="36" rx="3" fill="#203b4d"/><rect x="196" y="370" width="36" height="36" rx="3" fill="#203b4d"/><rect x="44" y="408" width="36" height="36" rx="3" fill="#203b4d"/><rect x="82" y="408" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="100.0" cy="419" r="6" fill="#ffbe55"/><path d="M100.0 425v13m-9-9h18m-9 9-7 6m7-6 7 6" stroke="#ffbe55" stroke-width="4"/><rect x="120" y="408" width="36" height="36" rx="3" fill="#203b4d"/><rect x="158" y="408" width="36" height="36" rx="3" fill="#203b4d"/><rect x="196" y="408" width="36" height="36" rx="3" fill="#203b4d"/><rect x="44" y="446" width="36" height="36" rx="3" fill="#203b4d"/><rect x="82" y="446" width="36" height="36" rx="3" fill="#203b4d"/><rect x="120" y="446" width="36" height="36" rx="3" fill="#203b4d"/><rect x="158" y="446" width="36" height="36" rx="3" fill="#203b4d"/><rect x="196" y="446" width="36" height="36" rx="3" fill="#203b4d"/><rect x="44" y="484" width="36" height="36" rx="3" fill="#638294"/><rect x="82" y="484" width="36" height="36" rx="3" fill="#638294"/><rect x="120" y="484" width="36" height="36" rx="3" fill="#638294"/><rect x="158" y="484" width="36" height="36" rx="3" fill="#638294"/><rect x="196" y="484" width="36" height="36" rx="3" fill="#638294"/><path d="M139 415v60" stroke="#ffbe55" stroke-width="4" stroke-dasharray="5 4"/><text x="44" y="556" fill="#f5f1e5" font-size="18" font-weight="normal">The shaft is now open.</text><text x="44" y="638" fill="#f5f1e5" font-size="22" font-weight="bold">3.