<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="405" viewBox="0 0 1120 405" role="img" aria-labelledby="title"><title id="title">Digging removes support; wait beside the falling rock</title><rect width="1120" height="405" rx="12" fill="#142635"/><g font-family="Arial, sans-serif"><text x="24" y="36" fill="#f5f1e5" font-size="23" font-weight="bold">REMOVE THE SUPPORT</text><text x="40" y="82" fill="#f5f1e5" font-size="22" font-weight="bold">1. Held up</text><rect x="40" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="78" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="116" y="94" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="134.0" cy="112.0" r="13.68" fill="#b4c9d0"/><rect x="154" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="192" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="40" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="78" y="132" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="96.0" cy="143" r="6" fill="#ffbe55"/><path d="M96.0 149v13m-9-9h18m-9 9-7 6m7-6 7 6" stroke="#ffbe55" stroke-width="4"/><rect x="116" y="132" width="36" height="36" rx="3" fill="#d6a15e"/><rect x="154" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="192" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="40" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="78" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="116" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="154" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="192" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="40" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="78" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="116" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="154" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="192" y="208" width="36" height="36" rx="3" fill="#638294"/><text x="40" y="280" fill="#f5f1e5" font-size="18" font-weight="normal">Dirt holds the rock.</text><text x="406" y="82" fill="#f5f1e5" font-size="22" font-weight="bold">2. Dig from beside it</text><rect x="406" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="444" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="482" y="94" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="500.0" cy="112.0" r="13.68" fill="#b4c9d0"/><rect x="520" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="558" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="406" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="444" y="132" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="462.0" cy="143" r="6" fill="#ffbe55"/><path d="M462.0 149v13m-9-9h18m-9 9-7 6m7-6 7 6" stroke="#ffbe55" stroke-width="4"/><rect x="482" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="520" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="558" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="406" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="444" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="482" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="520" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="558" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="406" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="444" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="482" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="520" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="558" y="208" width="36" height="36" rx="3" fill="#638294"/><path d="M501 139v60" stroke="#ffbe55" stroke-width="4" stroke-dasharray="5 4"/><text x="406" y="280" fill="#f5f1e5" font-size="18" font-weight="normal">The shaft is now open.</text><text x="772" y="82" fill="#f5f1e5" font-size="22" font-weight="bold">3. Let it settle</text><rect x="772" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="810" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="848" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="886" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="924" y="94" width="36" height="36" rx="3" fill="#203b4d"/><rect x="772" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="810" y="132" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="828.0" cy="143" r="6" fill="#ffbe55"/><path d="M828.0 149v13m-9-9h18m-9 9-7 6m7-6 7 6" stroke="#ffbe55" stroke-width="4"/><rect x="848" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="886" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="924" y="132" width="36" height="36" rx="3" fill="#203b4d"/><rect x="772" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="810" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="848" y="170" width="36" height="36" rx="3" fill="#203b4d"/><circle cx="866.0" cy="188.0" r="13.68" fill="#b4c9d0"/><rect x="886" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="924" y="170" width="36" height="36" rx="3" fill="#203b4d"/><rect x="772" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="810" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="848" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="886" y="208" width="36" height="36" rx="3" fill="#638294"/><rect x="924" y="208" width="36" height="36" rx="3" fill="#638294"/><text x="772" y="280" fill="#f5f1e5" font-size="18" font-weight="normal">Stay out of its path.</text><text x="24" y="381" fill="#bed0d5" font-size="15" font-weight="normal">Invented example • no rolling neighbours shown</text></g></svg>
