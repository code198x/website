<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Plan the landing, then leave</title><desc id="desc">A schematic jump over a gap. Reach alone is not sufficient if a hazard occupies the landing.</desc><rect x="0" y="0" width="960" height="350" rx="3" fill="#101d2a"/><text x="20" y="35" font-family="Arial,sans-serif" font-size="22" fill="#e7edf2">Plan the landing, then leave</text><text x="20" y="63" font-family="Arial,sans-serif" font-size="16" fill="#b3c3d0">Original schematic · not a game map</text><g transform="translate(20,85)"><text x="0" y="22" font-family="Arial,sans-serif" font-size="20" fill="#ffd67b">Choose a take-off point</text><rect x="0" y="165" width="165.6" height="15" rx="3" fill="#39718b"/><rect x="285.2" y="165" width="147.20000000000002" height="15" rx="3" fill="#39718b"/><path d="M40 158 Q211.60000000000002 25 354.2 158" fill="none" stroke="#79dfab" stroke-width="4"/><circle cx="40" cy="158" r="7" fill="#79dfab"/><circle cx="354.2" cy="158" r="7" fill="#ffd67b"/><text x="0" y="210" font-family="Arial,sans-serif" font-size="17" fill="#c7d5df">The arc must reach the ledge.</text></g><g transform="translate(480,85)"><text x="0" y="22" font-family="Arial,sans-serif" font-size="20" fill="#ffd67b">Choose a clear arrival</text><rect x="0" y="165" width="165.6" height="15" rx="3" fill="#39718b"/><rect x="285.2" y="165" width="147.20000000000002" height="15" rx="3" fill="#39718b"/><path d="M40 158 Q211.60000000000002 25 354.2 158" fill="none" stroke="#79dfab" stroke-width="4"/><circle cx="40" cy="158" r="7" fill="#79dfab"/><circle cx="354.2" cy="158" r="7" fill="#ffd67b"/><circle cx="303.6" cy="150" r="7" fill="#ff8e95"/><path d="M303.6 139 L372.6 139" stroke="#ff8e95" stroke-width="4" fill="none" stroke-dasharray="7 6"/><text x="271.4" y="120" font-family="Arial,sans-serif" font-size="15" fill="#ff8e95">Moving hazard</text><text x="0" y="210" font-family="Arial,sans-serif" font-size="17" fill="#c7d5df">The hazard moves while we jump.</text></g></svg>