<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Distance is only part of a route</title><desc id="desc">A direct hazardous route and a longer route with more room, both using the same time budget.</desc><rect x="0" y="0" width="960" height="350" rx="3" fill="#101d2a"/><text x="20" y="35" font-family="Arial,sans-serif" font-size="22" fill="#e7edf2">Distance is only part of a route</text><text x="20" y="63" font-family="Arial,sans-serif" font-size="16" fill="#b3c3d0">Original schematic · not a game map</text><g transform="translate(20,85)"><text x="0" y="22" font-family="Arial,sans-serif" font-size="20" fill="#ffd67b">Compare the journeys</text><path d="M25 142 L425 142" stroke="#ff8e95" stroke-width="4" fill="none"/><path d="M25 142 L25 70" stroke="#79dfab" stroke-width="4" fill="none"/><path d="M25 70 L425 70" stroke="#79dfab" stroke-width="4" fill="none"/><path d="M425 70 L425 142" stroke="#79dfab" stroke-width="4" fill="none"/><circle cx="25" cy="142" r="7" fill="#79dfab"/><circle cx="425" cy="142" r="7" fill="#ffd67b"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="16" fill="#e7edf2">Longer, safer?</text><text x="55" y="132" font-family="Arial,sans-serif" font-size="16" fill="#e7edf2">Shorter, riskier?</text><text x="0" y="210" font-family="Arial,sans-serif" font-size="17" fill="#c7d5df">Waiting also spends air.</text></g><g transform="translate(480,85)"><text x="0" y="22" font-family="Arial,sans-serif" font-size="20" fill="#ffd67b">Choose a route you can carry out</text><path d="M25 142 L425 142" stroke="#ff8e95" stroke-width="4" fill="none"/><path d="M25 142 L25 70" stroke="#79dfab" stroke-width="4" fill="none"/><path d="M25 70 L425 70" stroke="#79dfab" stroke-width="4" fill="none"/><path d="M425 70 L425 142" stroke="#79dfab" stroke-width="4" fill="none"/><circle cx="25" cy="142" r="7" fill="#79dfab"/><circle cx="425" cy="142" r="7" fill="#ffd67b"/><text x="55" y="62" font-family="Arial,sans-serif" font-size="16" fill="#e7edf2">Longer, safer?</text><text x="55" y="132" font-family="Arial,sans-serif" font-size="16" fill="#e7edf2">Shorter, riskier?</text><text x="0" y="210" font-family="Arial,sans-serif" font-size="17" fill="#c7d5df">A fast failed attempt still costs.</text></g></svg>