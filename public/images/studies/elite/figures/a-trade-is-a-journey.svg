<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc"><title id="title">The four parts of a trade</title><desc id="desc">Buy while docked, jump between systems, fly through local space, then dock and sell. The investment is at risk until arrival.</desc><rect width="1120" height="410" fill="#071923"/><g fill="#fff8e9" font-family="Arial, sans-serif"><text x="28" y="44" font-size="28" fill="#fff8e9">A trade is a journey</text><text x="28" y="76" font-size="15" fill="#52d2cf">Original explanation · no promised profit</text><circle cx="40" cy="145" r="10" fill="#52d2cf"/><text x="28" y="187" font-size="25" fill="#fff8e9">Buy</text><text x="28" y="215" font-size="16" fill="#fff8e9">Cash becomes cargo.</text><path d="M63 145h215m-8-5 8 5-8 5" stroke="#e8b04b" stroke-width="2" fill="none"/><circle cx="316" cy="145" r="10" fill="#52d2cf"/><text x="304" y="187" font-size="25" fill="#fff8e9">Jump</text><text x="304" y="215" font-size="16" fill="#fff8e9">Choose a reachable system.</text><path d="M339 145h215m-8-5 8 5-8 5" stroke="#e8b04b" stroke-width="2" fill="none"/><circle cx="592" cy="145" r="10" fill="#52d2cf"/><text x="580" y="187" font-size="25" fill="#fff8e9">Fly</text><text x="580" y="215" font-size="16" fill="#fff8e9">Navigate and survive.</text><path d="M615 145h215m-8-5 8 5-8 5" stroke="#e8b04b" stroke-width="2" fill="none"/><circle cx="868" cy="145" r="10" fill="#52d2cf"/><text x="856" y="187" font-size="25" fill="#fff8e9">Dock and sell</text><text x="856" y="215" font-size="16" fill="#fff8e9">Cargo becomes cash again.</text><text x="28" y="322" font-size="23" fill="#fff8e9">A good purchase earns nothing until the cargo reaches another market.</text></g></svg>
