<svg xmlns="http://www.w3.org/2000/svg" width="420" height="700" viewBox="0 0 420 700" role="img" aria-labelledby="title desc"><title id="title">The four parts of a trade</title><desc id="desc">Buy while docked, jump between systems, fly through local space, then dock and sell. The investment is at risk until arrival.</desc><rect width="420" height="700" fill="#071923"/><g fill="#fff8e9" font-family="Arial, sans-serif"><text x="28" y="44" font-size="28" fill="#fff8e9">A trade is a journey</text><text x="28" y="76" font-size="15" fill="#52d2cf">Original explanation · no promised profit</text><circle cx="40" cy="121" r="10" fill="#52d2cf"/><text x="28" y="163" font-size="25" fill="#fff8e9">Buy</text><text x="28" y="191" font-size="16" fill="#fff8e9">Cash becomes cargo.</text><path d="M40 206v27m-5-6 5 6 5-6" stroke="#e8b04b" stroke-width="2" fill="none"/><circle cx="40" cy="253" r="10" fill="#52d2cf"/><text x="28" y="295" font-size="25" fill="#fff8e9">Jump</text><text x="28" y="323" font-size="16" fill="#fff8e9">Choose a reachable system.</text><path d="M40 338v27m-5-6 5 6 5-6" stroke="#e8b04b" stroke-width="2" fill="none"/><circle cx="40" cy="385" r="10" fill="#52d2cf"/><text x="28" y="427" font-size="25" fill="#fff8e9">Fly</text><text x="28" y="455" font-size="16" fill="#fff8e9">Navigate and survive.</text><path d="M40 470v27m-5-6 5 6 5-6" stroke="#e8b04b" stroke-width="2" fill="none"/><circle cx="40" cy="517" r="10" fill="#52d2cf"/><text x="28" y="559" font-size="25" fill="#fff8e9">Dock and sell</text><text x="28" y="587" font-size="16" fill="#fff8e9">Cargo becomes cash again.</text><text x="28" y="670" font-size="18" fill="#fff8e9">The investment is at risk in between.</text></g></svg>
