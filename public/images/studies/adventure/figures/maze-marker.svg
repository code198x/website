<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="495" viewBox="0 0 1100 495" role="img" aria-labelledby="title desc"><title id="title">Recognising a returning route</title><desc id="desc">A conceptual before-and-after comparison. A repeated room description is ambiguous; a dropped object makes a returning route recognisable. This is not the cave map.</desc><rect width="1100" height="495" fill="#102e36"/><text x="40" y="55" fill="#fff8e9" font-family="sans-serif" font-size="33" font-weight="bold">A marker makes a place recognisable</text><text x="40" y="100" fill="#fff8e9" font-family="sans-serif" font-size="24" font-weight="normal">Same room. Same description. One extra piece of evidence.</text><rect x="40" y="150" width="490" height="252" fill="#fff8e9"/><text x="65" y="191" fill="#102e36" font-family="sans-serif" font-size="26" font-weight="bold">Before leaving a marker</text><text x="65" y="244" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">The maze description repeats.</text><text x="65" y="286" fill="#a43120" font-family="sans-serif" font-size="24" font-weight="bold">Have we come back?</text><path d="M450 314c-50-50-90-10-70 20s80 20 68-10l-12 8m12-8 4 14" stroke="#12706d" stroke-width="5" fill="none"/><text x="65" y="382" fill="#102e36" font-family="sans-serif" font-size="22" font-weight="normal">A route can loop to the same place.</text><rect x="570" y="150" width="490" height="252" fill="#fff8e9"/><text x="595" y="191" fill="#102e36" font-family="sans-serif" font-size="26" font-weight="bold">After leaving a marker</text><text x="595" y="244" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">The maze description repeats.</text><text x="595" y="286" fill="#12706d" font-family="sans-serif" font-size="24" font-weight="bold">The dropped object is still here.</text><path d="M980 314c-50-50-90-10-70 20s80 20 68-10l-12 8m12-8 4 14" stroke="#12706d" stroke-width="5" fill="none"/><text x="595" y="382" fill="#102e36" font-family="sans-serif" font-size="22" font-weight="normal">A route can loop to the same place.</text><text x="40" y="450" fill="#fff8e9" font-family="sans-serif" font-size="22" font-weight="normal">Conceptual comparison, not a reproduction of Adventure’s maze or its solution.</text></svg>