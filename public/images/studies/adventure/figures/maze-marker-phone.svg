<svg xmlns="http://www.w3.org/2000/svg" width="500" height="745" viewBox="0 0 500 745" role="img" aria-labelledby="title desc"><title id="title">Recognising a returning route</title><desc id="desc">Before and after placing an object as a marker. Its continued presence makes a self-loop recognisable. Conceptual diagram, not a cave map.</desc><rect width="500" height="745" fill="#102e36"/><text x="28" y="48" fill="#fff8e9" font-family="sans-serif" font-size="30" font-weight="bold">Have we come back?</text><text x="28" y="90" fill="#fff8e9" font-family="sans-serif" font-size="24" font-weight="normal">A marker gives us evidence.</text><rect x="28" y="132" width="444" height="220" fill="#fff8e9"/><text x="48" y="174" fill="#102e36" font-family="sans-serif" font-size="28" font-weight="bold">Before the marker</text><text x="48" y="226" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">The description repeats.</text><text x="48" y="261" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">Is this the same place?</text><text x="48" y="312" fill="#12706d" font-family="sans-serif" font-size="23" font-weight="bold">A route may loop back.</text><rect x="28" y="395" width="444" height="220" fill="#fff8e9"/><text x="48" y="437" fill="#102e36" font-family="sans-serif" font-size="28" font-weight="bold">After the marker</text><text x="48" y="489" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">The description repeats.</text><text x="48" y="524" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">Our dropped object is here.</text><text x="48" y="575" fill="#12706d" font-family="sans-serif" font-size="23" font-weight="bold">A route may loop back.</text><text x="28" y="670" fill="#fff8e9" font-family="sans-serif" font-size="23" font-weight="normal">Same location, before and after.</text><text x="28" y="709" fill="#fff8e9" font-family="sans-serif" font-size="23" font-weight="normal">Explanation, not a cave map.</text></svg>