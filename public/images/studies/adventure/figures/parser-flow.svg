<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">From sentence to action</title><desc id="desc">Five illustrative stages: words, grammar, object resolution, world rules and response. The example is our own; stages and order vary by engine.</desc><rect width="1120" height="450" fill="#102e36"/><text x="36" y="52" fill="#fff8e9" font-family="sans-serif" font-size="34" font-weight="bold">From a sentence to a possible action</text><text x="36" y="94" fill="#fff8e9" font-family="sans-serif" font-size="26" font-weight="normal">Our example: PUT THE BRASS KEY IN THE BOX</text><rect x="36" y="144" width="190" height="166" fill="#fff8e9"/><text x="52" y="185" fill="#102e36" font-family="sans-serif" font-size="27" font-weight="bold">Words</text><text x="52" y="229" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">Recognise</text><text x="52" y="259" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">vocabulary</text><path d="M230 222h15l-5-5m5 5-5 5" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="249" y="144" width="190" height="166" fill="#fff8e9"/><text x="265" y="185" fill="#102e36" font-family="sans-serif" font-size="27" font-weight="bold">Grammar</text><text x="265" y="229" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">Find</text><text x="265" y="259" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">a request form</text><path d="M443 222h15l-5-5m5 5-5 5" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="462" y="144" width="190" height="166" fill="#fff8e9"/><text x="478" y="185" fill="#102e36" font-family="sans-serif" font-size="27" font-weight="bold">Objects</text><text x="478" y="229" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">Identify</text><text x="478" y="259" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">key and box</text><path d="M656 222h15l-5-5m5 5-5 5" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="675" y="144" width="190" height="166" fill="#fff8e9"/><text x="691" y="185" fill="#102e36" font-family="sans-serif" font-size="27" font-weight="bold">Rules</text><text x="691" y="229" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">Can</text><text x="691" y="259" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">this happen now?</text><path d="M869 222h15l-5-5m5 5-5 5" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="888" y="144" width="190" height="166" fill="#fff8e9"/><text x="904" y="185" fill="#102e36" font-family="sans-serif" font-size="27" font-weight="bold">Response</text><text x="904" y="229" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">Describe</text><text x="904" y="259" fill="#102e36" font-family="sans-serif" font-size="20" font-weight="normal">the result</text><text x="36" y="361" fill="#fff8e9" font-family="sans-serif" font-size="23" font-weight="normal">Parser: determine what is meant. World rules: decide what happens.</text><text x="36" y="405" fill="#fff8e9" font-family="sans-serif" font-size="21" font-weight="normal">An explanatory model of richer parsers, not Adventure’s exact control flow.</text></svg>