<svg xmlns="http://www.w3.org/2000/svg" width="500" height="760" viewBox="0 0 500 760" role="img" aria-labelledby="title desc"><title id="title">A route opens</title><desc id="desc">Original diagram. Locked grate: route blocked. Carry keys and unlock grate: route underground opens. Early puzzle spoiler, not a historical screenshot.</desc><rect width="500" height="760" fill="#102e36"/><g fill="#fff8e9" font-family="sans-serif"><text x="32" y="48" font-size="27" font-weight="bold">The world remembers.</text><text x="32" y="85" font-size="23">One entrance. Two states.</text></g><rect x="32" y="116" width="436" height="238" fill="#fff8e9"/><rect x="32" y="438" width="436" height="238" fill="#fff8e9"/><g fill="#102e36" font-family="sans-serif" font-size="28"><text x="58" y="162" font-weight="bold">GRATE LOCKED</text><text x="58" y="219">Outside</text><text x="58" y="317">Below the grate</text><text x="58" y="484" font-weight="bold">GRATE UNLOCKED</text><text x="58" y="541">Outside</text><text x="58" y="639">Below the grate</text></g><path d="M377 200v105m-20-74 40 40m0-40-40 40" fill="none" stroke="#a43120" stroke-width="7"/><path d="M377 522v96l-12-12m12 12 12-12" fill="none" stroke="#12706d" stroke-width="7"/><text x="48" y="403" fill="#f3c45a" font-family="sans-serif" font-size="27">Carry keys → unlock grate</text><text x="32" y="724" fill="#fff8e9" font-family="sans-serif" font-size="23">Explanation, not a screenshot</text></svg>