<svg xmlns="http://www.w3.org/2000/svg" width="500" height="860" viewBox="0 0 500 860" role="img" aria-labelledby="title desc"><title id="title">From sentence to action</title><desc id="desc">Five illustrative stages: words, grammar, object resolution, rules and response. Our example, not Adventure’s exact control flow.</desc><rect width="500" height="860" fill="#102e36"/><text x="28" y="46" fill="#fff8e9" font-family="sans-serif" font-size="30" font-weight="bold">From words to action</text><text x="28" y="85" fill="#fff8e9" font-family="sans-serif" font-size="25" font-weight="normal">PUT THE BRASS KEY</text><text x="28" y="117" fill="#fff8e9" font-family="sans-serif" font-size="25" font-weight="normal">IN THE BOX</text><rect x="28" y="151" width="444" height="94" fill="#fff8e9"/><text x="48" y="187" fill="#102e36" font-family="sans-serif" font-size="28" font-weight="bold">Words</text><text x="48" y="223" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">Recognise vocabulary</text><path d="M250 249v18l-6-6m6 6 6-6" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="28" y="273" width="444" height="94" fill="#fff8e9"/><text x="48" y="309" fill="#102e36" font-family="sans-serif" font-size="28" font-weight="bold">Grammar</text><text x="48" y="345" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">Find a request form</text><path d="M250 371v18l-6-6m6 6 6-6" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="28" y="395" width="444" height="94" fill="#fff8e9"/><text x="48" y="431" fill="#102e36" font-family="sans-serif" font-size="28" font-weight="bold">Objects</text><text x="48" y="467" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">Identify key and box</text><path d="M250 493v18l-6-6m6 6 6-6" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="28" y="517" width="444" height="94" fill="#fff8e9"/><text x="48" y="553" fill="#102e36" font-family="sans-serif" font-size="28" font-weight="bold">Rules</text><text x="48" y="589" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">Can this happen now?</text><path d="M250 615v18l-6-6m6 6 6-6" stroke="#f3c45a" stroke-width="3" fill="none"/><rect x="28" y="639" width="444" height="94" fill="#fff8e9"/><text x="48" y="675" fill="#102e36" font-family="sans-serif" font-size="28" font-weight="bold">Response</text><text x="48" y="711" fill="#102e36" font-family="sans-serif" font-size="24" font-weight="normal">Describe the result</text><text x="28" y="795" fill="#fff8e9" font-family="sans-serif" font-size="23" font-weight="normal">Our explanatory model.</text><text x="28" y="829" fill="#fff8e9" font-family="sans-serif" font-size="23" font-weight="normal">Engines differ in stage and order.</text></svg>