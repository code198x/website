<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img"><title>Spending once, paying again</title><desc>An invented budget starts at 2000, spends 600 on construction, receives 900 tax and pays 1100 running costs, leaving 1200. Next year the unchanged 200 shortfall leaves 1000.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#22644e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="system-ui,sans-serif"><text x="32" y="48" font-size="32" fill="#22312c">Spending once, paying again</text><text x="32" y="85" font-size="22" fill="#22312c">Invented figures — not a SimCity formula.</text><path d="M32,182h205" stroke="#22312c" stroke-width="3"/><text x="32" y="170" font-size="23" fill="#22312c">Start</text><text x="32" y="231" font-size="38" fill="#22312c">$2,000</text><path d="M264,182h205" stroke="#a14331" stroke-width="3"/><text x="264" y="170" font-size="23" fill="#22312c">Build</text><text x="264" y="231" font-size="38" fill="#a14331">− $600</text><path d="M496,182h205" stroke="#22644e" stroke-width="3"/><text x="496" y="170" font-size="23" fill="#22312c">Tax</text><text x="496" y="231" font-size="38" fill="#22644e">+ $900</text><path d="M728,182h205" stroke="#a14331" stroke-width="3"/><text x="728" y="170" font-size="23" fill="#22312c">Services</text><text x="728" y="231" font-size="38" fill="#a14331">− $1,100</text><path d="M960,182h205" stroke="#22644e" stroke-width="3"/><text x="960" y="170" font-size="23" fill="#22312c">Finish</text><text x="960" y="231" font-size="38" fill="#22644e">$1,200</text><text x="32" y="426" font-size="22" fill="#22312c">Next year: $1,200 + $900 − $1,100 = $1,000</text><text x="32" y="466" font-size="22" fill="#22312c">No new building. The shortfall is still there.</text></g></svg>