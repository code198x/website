<svg xmlns="http://www.w3.org/2000/svg" width="640" height="950" viewBox="0 0 640 950" role="img"><title>A decision has more than one clock</title><desc>An original conceptual diagram separates immediate placement and payment from later simulated development and the player reading a map, graph or warning before deciding again. Not the game source update order.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#22644e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="system-ui,sans-serif"><text x="32" y="48" font-size="30" fill="#22312c">A decision has more than one clock</text><text x="32" y="87" font-size="21" fill="#22312c">Our explanation of the play loop, not source code.</text><rect x="32" y="145" width="576" height="130" rx="2" fill="#dfebdf"/><text x="52" y="183" font-size="22" fill="#22312c">PLACE</text><text x="52" y="230" font-size="23" fill="#22312c">We zone land and pay now.</text><path d="M320,282v32" stroke="#22644e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="325" width="576" height="130" rx="2" fill="#eee1c5"/><text x="52" y="363" font-size="22" fill="#22312c">WAIT</text><text x="52" y="410" font-size="23" fill="#22312c">The simulated city updates.</text><path d="M320,462v32" stroke="#22644e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="505" width="576" height="130" rx="2" fill="#e0e6ef"/><text x="52" y="543" font-size="22" fill="#22312c">NOTICE</text><text x="52" y="590" font-size="23" fill="#22312c">Buildings, warnings, maps, graphs.</text><path d="M320,642v32" stroke="#22644e" stroke-width="3" marker-end="url(#arrow)"/><rect x="32" y="685" width="576" height="130" rx="2" fill="#e9dfd5"/><text x="52" y="723" font-size="22" fill="#22312c">DECIDE</text><text x="52" y="770" font-size="23" fill="#22312c">What should we change next?</text><text x="32" y="915" font-size="20" fill="#22312c">A result after a change is a clue, not proof of one cause.</text></g></svg>