<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img"><title>Spending once, paying again</title><desc>An invented budget starts at 2000, spends 600 on construction, receives 900 tax and pays 1100 running costs, leaving 1200. Next year the unchanged 200 shortfall leaves 1000.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#22644e" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="system-ui,sans-serif"><text x="32" y="48" font-size="32" fill="#22312c">Spending once, paying again</text><text x="32" y="85" font-size="22" fill="#22312c">Invented figures — not a SimCity formula.</text><path d="M32,157h570" stroke="#22312c" stroke-width="3"/><text x="32" y="145" font-size="23" fill="#22312c">Start</text><text x="32" y="206" font-size="38" fill="#22312c">$2,000</text><path d="M32,272h570" stroke="#a14331" stroke-width="3"/><text x="32" y="260" font-size="23" fill="#22312c">Build</text><text x="32" y="321" font-size="38" fill="#a14331">− $600</text><path d="M32,387h570" stroke="#22644e" stroke-width="3"/><text x="32" y="375" font-size="23" fill="#22312c">Tax</text><text x="32" y="436" font-size="38" fill="#22644e">+ $900</text><path d="M32,502h570" stroke="#a14331" stroke-width="3"/><text x="32" y="490" font-size="23" fill="#22312c">Services</text><text x="32" y="551" font-size="38" fill="#a14331">− $1,100</text><path d="M32,617h570" stroke="#22644e" stroke-width="3"/><text x="32" y="605" font-size="23" fill="#22312c">Finish</text><text x="32" y="666" font-size="38" fill="#22644e">$1,200</text><text x="32" y="796" font-size="22" fill="#22312c">Next year: $1,200 + $900 − $1,100 = $1,000</text><text x="32" y="836" font-size="22" fill="#22312c">No new building. The shortfall is still there.</text></g></svg>