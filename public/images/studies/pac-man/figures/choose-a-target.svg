<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Choose a target</title><desc>An invented grid compares the player, an ahead target and a vector target. Coordinates increase rightwards and downwards.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#173bc8" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="system-ui,sans-serif"><text x="32" y="48" font-size="32" fill="#232725">Choose a target</text><text x="32" y="84" font-size="22" fill="#232725">The movement rule can stay the same.</text><text x="32" y="115" font-size="22" fill="#232725">Change the point it tries to approach.</text><path d="M190,145v329" stroke="#d5d8d2"/><path d="M237,145v329" stroke="#d5d8d2"/><path d="M284,145v329" stroke="#d5d8d2"/><path d="M331,145v329" stroke="#d5d8d2"/><path d="M378,145v329" stroke="#d5d8d2"/><path d="M425,145v329" stroke="#d5d8d2"/><path d="M472,145v329" stroke="#d5d8d2"/><path d="M519,145v329" stroke="#d5d8d2"/><path d="M566,145v329" stroke="#d5d8d2"/><path d="M613,145v329" stroke="#d5d8d2"/><path d="M660,145v329" stroke="#d5d8d2"/><path d="M707,145v329" stroke="#d5d8d2"/><path d="M754,145v329" stroke="#d5d8d2"/><path d="M801,145v329" stroke="#d5d8d2"/><path d="M848,145v329" stroke="#d5d8d2"/><path d="M895,145v329" stroke="#d5d8d2"/><path d="M942,145v329" stroke="#d5d8d2"/><path d="M989,145v329" stroke="#d5d8d2"/><path d="M190,145h799" stroke="#d5d8d2"/><path d="M190,192h799" stroke="#d5d8d2"/><path d="M190,239h799" stroke="#d5d8d2"/><path d="M190,286h799" stroke="#d5d8d2"/><path d="M190,333h799" stroke="#d5d8d2"/><path d="M190,380h799" stroke="#d5d8d2"/><path d="M190,427h799" stroke="#d5d8d2"/><path d="M190,474h799" stroke="#d5d8d2"/><path d="M331,380 L613,286" stroke="#173bc8" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M613,286 L895,192" stroke="#173bc8" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M519,286 L707,286" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><circle cx="519" cy="286" r="15" fill="#ffdf39" stroke="#232725" stroke-width="2"/><text x="519" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">P</text><circle cx="331" cy="380" r="15" fill="#b72b38" stroke="#232725" stroke-width="2"/><text x="331" y="386" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">B</text><circle cx="613" cy="286" r="15" fill="#d6d9d4" stroke="#232725" stroke-width="2"/><text x="613" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">A</text><circle cx="707" cy="286" r="15" fill="#a2dfe5" stroke="#232725" stroke-width="2"/><text x="707" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">K</text><circle cx="895" cy="192" r="15" fill="#173bc8" stroke="#232725" stroke-width="2"/><text x="895" y="198" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">T</text><text x="32" y="535" font-size="22" fill="#232725">P  Player: (7, 3), facing right</text><text x="622" y="535" font-size="22" fill="#232725">K  Four cells ahead: (11, 3)</text><text x="32" y="572" font-size="22" fill="#232725">B  Reference pursuer: (3, 5)</text><text x="622" y="572" font-size="22" fill="#232725">A  Two cells ahead: (9, 3)</text><text x="32" y="609" font-size="22" fill="#173bc8">T  Extend B → A again: (15, 1)</text></g></svg>