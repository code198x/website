<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img"><title>Choose the next turn</title><desc>Three legal next tiles are compared with a target at column six, row one. Right has squared distance ten, up sixteen and down twenty. Reverse is excluded.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#173bc8" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="system-ui,sans-serif"><text x="32" y="48" font-size="32" fill="#232725">Choose the next turn</text><text x="32" y="84" font-size="22" fill="#232725">Target: (6, 1). Current position: (2, 2).</text><path d="M70,170v260" stroke="#d5d8d2"/><path d="M135,170v260" stroke="#d5d8d2"/><path d="M200,170v260" stroke="#d5d8d2"/><path d="M265,170v260" stroke="#d5d8d2"/><path d="M330,170v260" stroke="#d5d8d2"/><path d="M395,170v260" stroke="#d5d8d2"/><path d="M460,170v260" stroke="#d5d8d2"/><path d="M525,170v260" stroke="#d5d8d2"/><path d="M70,170h455" stroke="#d5d8d2"/><path d="M70,235h455" stroke="#d5d8d2"/><path d="M70,300h455" stroke="#d5d8d2"/><path d="M70,365h455" stroke="#d5d8d2"/><path d="M70,430h455" stroke="#d5d8d2"/><path d="M200,300 L200,235" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M200,300 L265,300" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M200,300 L200,365" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><circle cx="200" cy="300" r="15" fill="#ffdf39" stroke="#232725" stroke-width="2"/><text x="200" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">G</text><circle cx="460" cy="235" r="15" fill="#173bc8" stroke="#232725" stroke-width="2"/><text x="460" y="241" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">T</text><text x="125" y="308" font-size="32" fill="#a12e39">×</text><text x="32" y="515" font-size="27" fill="#232725">UP: 16</text><text x="32" y="550" font-size="23" fill="#232725">4 × 4 + 0 × 0</text><text x="32" y="610" font-size="27" fill="#173bc8">RIGHT: 10</text><text x="32" y="645" font-size="23" fill="#173bc8">3 × 3 + 1 × 1</text><text x="32" y="705" font-size="27" fill="#232725">DOWN: 20</text><text x="32" y="740" font-size="23" fill="#232725">4 × 4 + 2 × 2</text><text x="32" y="836" font-size="22" fill="#173bc8">Right wins: the smallest squared distance.</text><text x="32" y="870" font-size="20" fill="#232725">A local decision, not a search of the whole maze.</text></g></svg>