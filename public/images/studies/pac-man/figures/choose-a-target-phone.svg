<svg xmlns="http://www.w3.org/2000/svg" width="640" height="850" viewBox="0 0 640 850" role="img"><title>Choose a target</title><desc>An invented grid compares the player, an ahead target and a vector target. Coordinates increase rightwards and downwards.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#173bc8" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="system-ui,sans-serif"><text x="32" y="48" font-size="32" fill="#232725">Choose a target</text><text x="32" y="84" font-size="22" fill="#232725">The movement rule can stay the same.</text><text x="32" y="115" font-size="22" fill="#232725">Change the point it tries to approach.</text><path d="M56,180v210" stroke="#d5d8d2"/><path d="M86,180v210" stroke="#d5d8d2"/><path d="M116,180v210" stroke="#d5d8d2"/><path d="M146,180v210" stroke="#d5d8d2"/><path d="M176,180v210" stroke="#d5d8d2"/><path d="M206,180v210" stroke="#d5d8d2"/><path d="M236,180v210" stroke="#d5d8d2"/><path d="M266,180v210" stroke="#d5d8d2"/><path d="M296,180v210" stroke="#d5d8d2"/><path d="M326,180v210" stroke="#d5d8d2"/><path d="M356,180v210" stroke="#d5d8d2"/><path d="M386,180v210" stroke="#d5d8d2"/><path d="M416,180v210" stroke="#d5d8d2"/><path d="M446,180v210" stroke="#d5d8d2"/><path d="M476,180v210" stroke="#d5d8d2"/><path d="M506,180v210" stroke="#d5d8d2"/><path d="M536,180v210" stroke="#d5d8d2"/><path d="M566,180v210" stroke="#d5d8d2"/><path d="M56,180h510" stroke="#d5d8d2"/><path d="M56,210h510" stroke="#d5d8d2"/><path d="M56,240h510" stroke="#d5d8d2"/><path d="M56,270h510" stroke="#d5d8d2"/><path d="M56,300h510" stroke="#d5d8d2"/><path d="M56,330h510" stroke="#d5d8d2"/><path d="M56,360h510" stroke="#d5d8d2"/><path d="M56,390h510" stroke="#d5d8d2"/><path d="M146,330 L326,270" stroke="#173bc8" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M326,270 L506,210" stroke="#173bc8" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M266,270 L386,270" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><circle cx="266" cy="270" r="15" fill="#ffdf39" stroke="#232725" stroke-width="2"/><text x="266" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">P</text><circle cx="146" cy="330" r="15" fill="#b72b38" stroke="#232725" stroke-width="2"/><text x="146" y="336" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">B</text><circle cx="326" cy="270" r="15" fill="#d6d9d4" stroke="#232725" stroke-width="2"/><text x="326" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">A</text><circle cx="386" cy="270" r="15" fill="#a2dfe5" stroke="#232725" stroke-width="2"/><text x="386" y="276" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">K</text><circle cx="506" cy="210" r="15" fill="#173bc8" stroke="#232725" stroke-width="2"/><text x="506" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">T</text><text x="32" y="470" font-size="22" fill="#232725">P  Player: (7, 3), facing right</text><text x="32" y="519" font-size="22" fill="#232725">K  Four cells ahead: (11, 3)</text><text x="32" y="568" font-size="22" fill="#232725">B  Reference pursuer: (3, 5)</text><text x="32" y="617" font-size="22" fill="#232725">A  Two cells ahead: (9, 3)</text><text x="32" y="666" font-size="22" fill="#173bc8">T  Extend B → A again: (15, 1)</text><text x="32" y="800" font-size="20" fill="#232725">Invented coordinates; not an original maze.</text></g></svg>