<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img"><title>Choose the next turn</title><desc>Three legal next tiles are compared with a target at column six, row one. Right has squared distance ten, up sixteen and down twenty. Reverse is excluded.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#173bc8" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f7f5ef"/><g font-family="system-ui,sans-serif"><text x="32" y="48" font-size="32" fill="#232725">Choose the next turn</text><text x="32" y="84" font-size="22" fill="#232725">Target: (6, 1). Current position: (2, 2).</text><path d="M60,150v232" stroke="#d5d8d2"/><path d="M118,150v232" stroke="#d5d8d2"/><path d="M176,150v232" stroke="#d5d8d2"/><path d="M234,150v232" stroke="#d5d8d2"/><path d="M292,150v232" stroke="#d5d8d2"/><path d="M350,150v232" stroke="#d5d8d2"/><path d="M408,150v232" stroke="#d5d8d2"/><path d="M466,150v232" stroke="#d5d8d2"/><path d="M60,150h406" stroke="#d5d8d2"/><path d="M60,208h406" stroke="#d5d8d2"/><path d="M60,266h406" stroke="#d5d8d2"/><path d="M60,324h406" stroke="#d5d8d2"/><path d="M60,382h406" stroke="#d5d8d2"/><path d="M176,266 L176,208" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M176,266 L234,266" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M176,266 L176,324" stroke="#173bc8" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><circle cx="176" cy="266" r="15" fill="#ffdf39" stroke="#232725" stroke-width="2"/><text x="176" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#171d1a">G</text><circle cx="408" cy="208" r="15" fill="#173bc8" stroke="#232725" stroke-width="2"/><text x="408" y="214" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">T</text><text x="108" y="274" font-size="32" fill="#a12e39">×</text><text x="570" y="190" font-size="27" fill="#232725">UP: 16</text><text x="570" y="225" font-size="23" fill="#232725">4 × 4 + 0 × 0</text><text x="570" y="285" font-size="27" fill="#173bc8">RIGHT: 10</text><text x="570" y="320" font-size="23" fill="#173bc8">3 × 3 + 1 × 1</text><text x="570" y="380" font-size="27" fill="#232725">DOWN: 20</text><text x="570" y="415" font-size="23" fill="#232725">4 × 4 + 2 × 2</text><text x="32" y="526" font-size="22" fill="#173bc8">Right wins: the smallest squared distance.</text><text x="32" y="560" font-size="20" fill="#232725">A local decision, not a search of the whole maze.</text></g></svg>