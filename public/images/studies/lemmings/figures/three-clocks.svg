<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Which event needs us next?</title><desc id="desc">Three independent illustrative deadlines: next walker, builder finishing, and level clock.</desc><rect x="0" y="0" width="960" height="350" rx="3" fill="#101d2a"/><text x="20" y="35" font-family="Arial,sans-serif" font-size="22" fill="#e7edf2">Which event needs us next?</text><text x="20" y="63" font-family="Arial,sans-serif" font-size="16" fill="#b3c3d0">Original schematic · not a game map</text><g transform="translate(20,85)"><text x="0" y="22" font-family="Arial,sans-serif" font-size="20" fill="#ffd67b">Next walker</text><path d="M10 100 L276 100" stroke="#718a9e" stroke-width="4" fill="none"/><circle cx="189.72" cy="100" r="7" fill="#ffd67b"/><path d="M189.72 85 L189.72 115" stroke="#ffd67b" stroke-width="4" fill="none"/><text x="10" y="76" font-family="Arial,sans-serif" font-size="18" fill="#e7edf2">Reaches danger in 4 seconds</text><text x="0" y="210" font-family="Arial,sans-serif" font-size="17" fill="#c7d5df">A local deadline.</text></g><g transform="translate(326,85)"><text x="0" y="22" font-family="Arial,sans-serif" font-size="20" fill="#ffd67b">Builder finishes</text><path d="M10 100 L276 100" stroke="#718a9e" stroke-width="4" fill="none"/><circle cx="189.72" cy="100" r="7" fill="#ffd67b"/><path d="M189.72 85 L189.72 115" stroke="#ffd67b" stroke-width="4" fill="none"/><text x="10" y="76" font-family="Arial,sans-serif" font-size="18" fill="#e7edf2">Needs attention in 7 seconds</text><text x="0" y="210" font-family="Arial,sans-serif" font-size="17" fill="#c7d5df">A job already in progress.</text></g><g transform="translate(632,85)"><text x="0" y="22" font-family="Arial,sans-serif" font-size="20" fill="#ffd67b">Level ends</text><path d="M10 100 L276 100" stroke="#718a9e" stroke-width="4" fill="none"/><circle cx="189.72" cy="100" r="7" fill="#ffd67b"/><path d="M189.72 85 L189.72 115" stroke="#ffd67b" stroke-width="4" fill="none"/><text x="10" y="76" font-family="Arial,sans-serif" font-size="18" fill="#e7edf2">Time remaining: 2 minutes</text><text x="0" y="210" font-family="Arial,sans-serif" font-size="17" fill="#c7d5df">The overall deadline.</text></g></svg>