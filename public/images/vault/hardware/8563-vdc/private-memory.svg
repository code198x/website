<svg xmlns="http://www.w3.org/2000/svg" width="520" height="696" viewBox="0 0 520 696"><style>text{font-family:Arial,sans-serif;fill:#f0eee6}.label{font-size:24px;font-weight:700}.note{font-size:21px;fill:#c3c7c9}.small{font-size:18px;fill:#a9c8cc}</style><rect width="520" height="696" fill="#182128"/><text x="28" y="39" class="small">COMMODORE 128</text><text x="28" y="83" style="font-size:30px;font-weight:700">Through the VDC’s ports</text><rect x="28" y="116" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="150" class="label">CPU writes $D600</text><text x="48" y="180" class="note">Select an internal register</text><path d="M260 210v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="238" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="272" class="label">CPU reads status at $D600</text><text x="48" y="302" class="note">Wait until ready bit 7 is set</text><path d="M260 332v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="360" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="394" class="label">CPU uses $D601</text><text x="48" y="424" class="note">Read or write the selected data</text><path d="M260 454v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="482" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="516" class="label">VDC manages video RAM</text><text x="48" y="546" class="note">Private memory supplies the display</text><text x="28" y="648" class="small">Register 31 is the video-memory data path.</text><text x="28" y="673" class="small">Screen layout and block operations use registers.</text></svg>