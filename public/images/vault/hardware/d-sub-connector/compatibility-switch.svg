<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img" aria-labelledby="title desc">
<title id="title">A compatibility selector changes the circuit</title>
<desc id="desc">Illustrative second-button wiring. In the C64 position, the pressed button joins pins 6 and 8. In the MSX position it joins pins 7 and 8, shorting a C64's five-volt supply to ground. Both panels show a C64 connection, not an MSX connection.</desc>
<rect width="600" height="620" rx="12" fill="#faf6ed"/>
<style>text{font-family:ui-monospace,monospace;fill:#473a32;font-size:22px}.heading{font-family:system-ui,sans-serif;font-weight:650;font-size:25px}.wire{fill:none;stroke:#473a32;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.inactive{stroke:#b8aea3;stroke-dasharray:5 6}.node{fill:#faf6ed;stroke:#473a32;stroke-width:3}.danger{fill:#983b27}</style>
<g transform="translate(0 0)">
<text x="26" y="42" class="heading">01  C64 setting on a C64</text>
<text x="26" y="91">Pin 6 · fire</text><text x="26" y="151">Pin 7 · +5 V</text>
<path class="wire " d="M216 84 H270"/>
<path class="wire inactive" d="M216 144 H270"/>
<path class="wire" d="M270 84 L325 114 H390 M435 114 H548 V210 H216" style="stroke:#346459"/>
<path class="wire" d="M390 114 H435 M405 100 H423 M414 100 V90" style="stroke:#346459"/>
<circle class="node" cx="270" cy="84" r="5"/><circle class="node" cx="270" cy="144" r="5"/>
<circle class="node" cx="325" cy="114" r="5"/>
<text x="260" y="185" font-size="20">Selector</text>
<text x="361" y="73" font-size="20">Pressed</text>
<text x="26" y="217">Pin 8 · GND</text>
<text x="26" y="269" style="fill:#346459">Normal fire: input → ground</text>
</g><g transform="translate(0 300)">
<text x="26" y="42" class="heading">02  MSX setting on a C64</text>
<text x="26" y="91">Pin 6 · fire</text><text x="26" y="151">Pin 7 · +5 V</text>
<path class="wire inactive" d="M216 84 H270"/>
<path class="wire " d="M216 144 H270"/>
<path class="wire" d="M270 144 L325 114 H390 M435 114 H548 V210 H216" style="stroke:#983b27"/>
<path class="wire" d="M390 114 H435 M405 100 H423 M414 100 V90" style="stroke:#983b27"/>
<circle class="node" cx="270" cy="84" r="5"/><circle class="node" cx="270" cy="144" r="5"/>
<circle class="node" cx="325" cy="114" r="5"/>
<text x="260" y="185" font-size="20">Selector</text>
<text x="361" y="73" font-size="20">Pressed</text>
<text x="26" y="217">Pin 8 · GND</text>
<text x="26" y="269" style="fill:#983b27">Supply short: +5 V → ground</text>
</g><path d="M26 296 H574" stroke="#d9cfc2"/><text x="26" y="603" style="font-size:18px">Illustrative wiring · only extra button shown</text></svg>