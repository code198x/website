<svg xmlns="http://www.w3.org/2000/svg" width="520" height="696" viewBox="0 0 520 696"><style>text{font-family:Arial,sans-serif;fill:#f0eee6}.label{font-size:24px;font-weight:700}.note{font-size:21px;fill:#c3c7c9}.small{font-size:18px;fill:#a9c8cc}</style><rect width="520" height="696" fill="#182128"/><text x="28" y="39" class="small">MOTOROLA MC6845</text><text x="28" y="83" style="font-size:30px;font-weight:700">From scan to picture</text><rect x="28" y="116" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="150" class="label">CRTC timing and addresses</text><text x="48" y="180" class="note">Memory address + raster row</text><path d="M260 210v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="238" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="272" class="label">Signals to external circuitry</text><text x="48" y="302" class="note">Sync · display enable · cursor</text><path d="M260 332v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="360" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="394" class="label">Display memory and pixel logic</text><text x="48" y="424" class="note">Fetch data; make dots and colour</text><path d="M260 454v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="482" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="516" class="label">Visible picture</text><text x="48" y="546" class="note">Depends on the computer’s design</text><text x="28" y="648" class="small">The CRTC does not output finished RGB pixels.</text><text x="28" y="673" class="small">Functional stages; wiring varies by machine.</text></svg>