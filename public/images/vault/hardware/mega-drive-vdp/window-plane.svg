<svg xmlns="http://www.w3.org/2000/svg" width="520" height="552" viewBox="0 0 520 552"><style>text{font-family:Arial,sans-serif;fill:#f0eee6}.note{font-size:21px;fill:#c3c7c9}</style><rect width="520" height="552" fill="#182128"/><text x="28" y="39" style="font-size:18px;fill:#a9c8cc">MEGA DRIVE · ONE WINDOW ARRANGEMENT</text><text x="28" y="84" style="font-size:30px;font-weight:700">The window replaces A</text><rect x="28" y="116" width="464" height="100" fill="#37636a" stroke="#9ccbd0"/><text x="50" y="156" style="font-size:25px;font-weight:700">Window: fixed panel</text><text x="50" y="188" class="note">Plane A is absent in this strip</text><rect x="28" y="216" width="464" height="150" fill="#26353f" stroke="#60888d"/><text x="50" y="273" style="font-size:25px;font-weight:700">Plane A: scrolling view</text><text x="50" y="312" class="note">Visible outside the window area</text><text x="28" y="416" class="note">Plane B and sprites are combined</text><text x="28" y="446" class="note">with this result through priority rules.</text><text x="28" y="501" style="font-size:18px;fill:#a9c8cc">Schematic regions; not a captured game screen.</text><text x="28" y="527" style="font-size:18px;fill:#a9c8cc">The window is not a third scrolling background.</text></svg>