<svg xmlns="http://www.w3.org/2000/svg" width="520" height="696" viewBox="0 0 520 696"><style>text{font-family:Arial,sans-serif;fill:#f0eee6}.label{font-size:24px;font-weight:700}.note{font-size:21px;fill:#c3c7c9}.small{font-size:18px;fill:#a9c8cc}</style><rect width="520" height="696" fill="#182128"/><text x="28" y="39" class="small">SUPER NINTENDO</text><text x="28" y="83" style="font-size:30px;font-weight:700">A separate sound system</text><rect x="28" y="116" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="150" class="label">Game CPU</text><text x="48" y="180" class="note">Four byte ports carry messages</text><path d="M260 210v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="238" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="272" class="label">S-SMP / SPC700 core</text><text x="48" y="302" class="note">Runs the sound driver</text><path d="M260 332v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="360" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="394" class="label">64KB shared audio RAM</text><text x="48" y="424" class="note">Driver · music · samples · echo</text><path d="M260 454v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="482" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="516" class="label">S-DSP: eight voices</text><text x="48" y="546" class="note">Reads samples; uses echo storage</text><text x="28" y="648" class="small">Functional flow; shared RAM serves both chips.</text><text x="28" y="673" class="small">Echo storage reduces room for other data.</text></svg>