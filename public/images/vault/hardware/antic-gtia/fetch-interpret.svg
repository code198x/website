<svg xmlns="http://www.w3.org/2000/svg" width="520" height="574" viewBox="0 0 520 574"><style>text{font-family:Arial,sans-serif;fill:#f0eee6}.label{font-size:24px;font-weight:700}.note{font-size:21px;fill:#c3c7c9}.small{font-size:18px;fill:#a9c8cc}</style><rect width="520" height="574" fill="#182128"/><text x="28" y="39" class="small">NORMAL-WIDTH ANTIC MODE F</text><text x="28" y="83" style="font-size:30px;font-weight:700">Same bits, different pixels</text><rect x="28" y="116" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="150" class="label">ANTIC fetches 40 bytes</text><text x="48" y="180" class="note">40 × 8 = 320 bits per line</text><path d="M260 210v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="238" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="272" class="label">GTIA groups four bits</text><text x="48" y="302" class="note">320 ÷ 4 = 80 wide pixels</text><path d="M260 332v20m-6-6 6 6 6-6" stroke="#9ccbd0" fill="none" stroke-width="2"/><rect x="28" y="360" width="464" height="88" rx="5" fill="#26353f" stroke="#60888d"/><text x="48" y="394" class="label">Mode 9 / 10 / 11</text><text x="48" y="424" class="note">Luminance / colour register / hue</text><text x="28" y="526" class="small">Extra colour choice trades horizontal detail.</text><text x="28" y="551" class="small">This example omits player/missile graphics.</text></svg>