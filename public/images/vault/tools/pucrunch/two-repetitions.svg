<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630">
<rect width="960" height="630" fill="#faf6ec"/>
<style>text{font-family:Arial,sans-serif;fill:#202a35} .label{font-size:38px;font-weight:700} .small{font-size:34px} .box{fill:#fffdf8;stroke:#374f68;stroke-width:3} .arrow{fill:none;stroke:#374f68;stroke-width:5;marker-end:url(#tip)}</style>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374f68"/></marker></defs>
<text class="label" x="42" y="66">Two ways to describe repetition</text>
<rect class="box" x="50" y="110" width="860" height="208" rx="12"/>
<text class="small" x="88" y="158">A repeated sequence</text><text class="label" x="88" y="212">ABABABAB</text><text class="small" x="88" y="274">AB, then copy 6 bytes from 2 back</text>
<rect class="box" x="50" y="350" width="860" height="208" rx="12"/>
<text class="small" x="88" y="398">A run of one byte</text><text class="label" x="88" y="452">AAAAAAAA</text><text class="small" x="88" y="514">Repeat A eight times</text>
<text class="small" x="50" y="605">Concepts, not the stored bit patterns</text></svg>