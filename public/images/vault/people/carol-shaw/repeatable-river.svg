<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" role="img" aria-labelledby="title desc">
<title id="title">Making a repeatable river</title>
<desc id="desc">A starting value feeds a repeatable number generator. The sequence selects river widths, which are drawn section by section. Repeating the starting value repeats the sequence. This is a schematic, not River Raid code or game data.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#303536"/></marker></defs>
<rect width="800" height="760" fill="#f5f1e8"/>
<g font-family="Arial, sans-serif" fill="#22282a">
<text x="400" y="65" text-anchor="middle" font-size="38" font-weight="700">Making a repeatable river</text>
<g stroke="#303536" stroke-width="2"><rect x="55" y="105" width="690" height="100" rx="10" fill="#e9e1b7"/><rect x="55" y="250" width="690" height="100" rx="10" fill="#fffdf8"/><rect x="55" y="395" width="690" height="100" rx="10" fill="#fffdf8"/><rect x="55" y="540" width="690" height="100" rx="10" fill="#d9e5f1"/></g>
<g text-anchor="middle" font-size="30"><text x="400" y="166">1. Keep a starting value</text><text x="400" y="311">2. Generate a repeatable sequence</text><text x="400" y="456">3. Use each value to choose a width</text><text x="400" y="601">4. Draw the next river section</text></g>
<g stroke="#303536" stroke-width="3" marker-end="url(#arrow)"><path d="M400 210 V238"/><path d="M400 355 V383"/><path d="M400 500 V528"/></g>
<text x="400" y="694" text-anchor="middle" font-size="28">Same start → same sequence</text>
<text x="400" y="732" text-anchor="middle" font-size="22">Schematic principle; not actual game code or level data</text>
</g></svg>
