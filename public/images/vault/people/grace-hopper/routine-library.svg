<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535"><rect width="1000" height="535" fill="#f6f2e9"/><g font-family="sans-serif" fill="#262c30"><text x="54" y="67" font-size="31" font-weight="700">Putting existing routines to work</text><text x="54" y="103" font-size="19" fill="#555e64">EXPLANATORY SCHEMATIC · CODE198X</text><rect x="54" y="140" width="892" height="83" rx="4" fill="#e5e9e5" stroke="#697b76"/><text x="76" y="172" font-size="24" font-weight="600">Describe the routines needed</text><text x="76" y="202" font-size="21">A job refers to pieces of calculation already available.</text><path d="M500 225v17m-7-7 7 7 7-7" fill="none" stroke="#3a625b" stroke-width="3"/><rect x="54" y="245" width="892" height="83" rx="4" fill="#e5e9e5" stroke="#697b76"/><text x="76" y="277" font-size="24" font-weight="600">Select from a library</text><text x="76" y="307" font-size="21">Existing routines supply those pieces.</text><path d="M500 330v17m-7-7 7 7 7-7" fill="none" stroke="#3a625b" stroke-width="3"/><rect x="54" y="350" width="892" height="83" rx="4" fill="#e5e9e5" stroke="#697b76"/><text x="76" y="382" font-size="24" font-weight="600">Bring the pieces together</text><text x="76" y="412" font-size="21">The selected routines contribute to the job.</text><text x="54" y="508" font-size="20">Library principle only; not A-0 notation or a modern compiler pipeline.</text></g></svg>
