<svg xmlns="http://www.w3.org/2000/svg" width="520" height="500" viewBox="0 0 520 500" role="img">
<title>Choose an operating mode</title>
<rect width="520" height="500" fill="#f5f1e7"/>
<text x="28" y="48" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#192c39">Choose an operating mode</text>
<rect x="24" y="82" width="472" height="104" rx="10" fill="#ffffff" stroke="#637c86" stroke-width="2"/>
<text x="42" y="118" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#192c39">C128 mode</text>
<text x="42" y="155" font-family="Arial,sans-serif" font-size="21" fill="#304d58">8502 · BASIC 7 · banked main RAM</text>
<rect x="24" y="210" width="472" height="104" rx="10" fill="#ffffff" stroke="#637c86" stroke-width="2"/>
<text x="42" y="246" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#192c39">C64 mode</text>
<text x="42" y="283" font-family="Arial,sans-serif" font-size="21" fill="#304d58">8502 · C64 software environment</text>
<rect x="24" y="338" width="472" height="104" rx="10" fill="#ffffff" stroke="#637c86" stroke-width="2"/>
<text x="42" y="374" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#192c39">CP/M mode</text>
<text x="42" y="411" font-family="Arial,sans-serif" font-size="21" fill="#304d58">Z80 · CP/M software environment</text>
<text x="28" y="484" font-family="Arial,sans-serif" font-size="16" fill="#304d58">Code198x · original explanatory diagram</text>
</svg>