# Lesson structure consistency for educational content
extends: existence  
message: "Consider using consistent lesson structure"
level: suggestion
ignorecase: true
tokens:
  # Encourage active learning language
  - "Let's explore"
  - "You'll discover"
  - "We'll build"
  - "You'll create"
  - "Let's implement"
  
  # Section header consistency
  - "## What You'll Learn"
  - "## What You're Building"
  - "## Quick Review"
  - "## Next Steps"
  - "## Challenge Exercise"
  
  # Call-to-action consistency
  - "Try this now"
  - "Experiment with"
  - "Test your understanding"
  - "Apply what you've learned" 