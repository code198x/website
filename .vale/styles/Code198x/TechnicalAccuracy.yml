# Technical accuracy for retro computing specifications
extends: substitution
message: "Technical specification error: use '%s' instead of '%s'"
level: warning
ignorecase: false
swap:
  # Commodore 64 specifications
  '64k': '64 KB'
  '1mhz': '1 MHz'
  '0.985mhz': '0.985 MHz'
  '1.023mhz': '1.023 MHz'
  'vic2': 'VIC-II'
  'sid chip': 'SID'
  
  # Memory addressing
  '$400': '$0400'
  '$800': '$0800'
  '$d800': '$D800'
  '$d000': '$D000'
  
  # Assembly syntax consistency
  'LDA#': 'LDA #'
  'STA$': 'STA $'
  'JMP$': 'JMP $'
  
  # File extension consistency
  '.prg': '.PRG'
  '.d64': '.D64'
  '.sid': '.SID'
  
  # Color specifications
  'light blue': 'cyan'
  'dark blue': 'blue'
  'bright red': 'red'
  
  # Resolution specifications
  '320x200': '320×200'
  '160x200': '160×200'
  '40x25': '40×25' 