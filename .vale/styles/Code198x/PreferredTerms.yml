# Preferred terminology for Code198x platform
extends: substitution
message: "Use '%s' instead of '%s'"
level: suggestion
ignorecase: true
swap:
  # System naming consistency
  'commodore 64': 'Commodore 64'
  'c-64': 'C64'
  'nintendo nes': 'Nintendo Entertainment System'
  'zx-spectrum': 'ZX Spectrum'
  'amiga 500': 'Commodore Amiga'
  
  # Technical term consistency
  '6502 processor': '6502'
  '6502 cpu': '6502'
  'vic-2': 'VIC-II'
  'vic 2': 'VIC-II'
  'sid chip': 'SID'
  'sound interface device': 'SID'
  
  # Assembly language terms
  'assembly language': 'assembly'
  'machine code': 'machine language'
  'hex': 'hexadecimal'
  'accumulator register': 'accumulator'
  
  # Memory terms
  'kb': 'KB'
  'mb': 'MB'
  'kilobytes': 'KB'
  'megabytes': 'MB'
  
  # Educational terminology
  'course': 'phase'
  'module': 'tier'
  'chapter': 'lesson'
  'tutorial': 'lesson'
  
  # Programming style
  'subroutine': 'routine'
  'function call': 'routine call'
  'code block': 'code section'
  
  # Avoid informal terms
  'awesome': 'excellent'
  'cool': 'impressive'
  'neat': 'elegant'
  'super': 'very'
  
  # Consistency in game development terms
  'game development': 'game programming'
  'video game': 'game'
  'computer game': 'game'