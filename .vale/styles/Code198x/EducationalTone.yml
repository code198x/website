# Educational tone guidelines for Code198x
extends: existence
message: "Consider using more encouraging educational language"
level: suggestion
ignorecase: true
tokens:
  # Avoid discouraging language
  - 'difficult to understand'
  - 'hard to grasp'
  - 'impossible to'
  - 'you should already know'
  - 'obviously'
  - 'of course'
  - 'simply'
  - 'just'
  - 'trivial'
  - 'easy to see'
  
  # Avoid absolute statements that might discourage
  - 'you must'
  - 'you have to'
  - 'required knowledge'
  - 'prerequisite understanding'
  
  # Avoid negative framing
  - "this won't work"
  - "you can't"
  - "impossible"
  - "won't be able to" 